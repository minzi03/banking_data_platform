# =============================================================================
# Banking Data Platform — Project Configuration
# =============================================================================
# Unified config for: ruff (lint), pytest, mypy, and project metadata.
# =============================================================================

[project]
name = "banking-data-platform"
version = "2.0.0"
description = "End-to-end banking data lakehouse: PostgreSQL → Bronze → Silver → Gold → Serving"
requires-python = ">=3.10"
license = {text = "MIT"}

# ---------------------------------------------------------------------------
# Dev dependencies — installed via: pip install -e ".[dev]"
# ---------------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    # Linting & formatting
    "ruff>=0.4.0",
    # Testing
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",       # parallel test execution
    # Type checking (optional, warn-only)
    "mypy>=1.10",
    # Pre-commit
    "pre-commit>=3.7",
]
# Runtime deps for CI seed job (not Spark — just psycopg2 + yaml)
seed = [
    "psycopg2-binary>=2.9",
    "PyYAML>=6.0",
]
# API service
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "trino>=0.327",
    "pydantic>=2.9",
]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "T20",  # flake8-print (warn on print statements)
    "PLW",  # pylint warnings
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "T201",   # print found — acceptable in ETL scripts
    "B008",   # function call in default argument (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["code_etl", "data_generator"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: tests requiring Docker/Spark infrastructure",
    "security: security-related tests",
]
# Fail fast in CI, allow parallel locally
# CI sets: pytest -x (fail fast)

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["code_etl", "data_generator", "api", "ml"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "code_etl/bronze/bootstrap/test_jdbc.py",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

# ---------------------------------------------------------------------------
# Mypy (optional, warn-only in CI)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false   # too strict for existing codebase
