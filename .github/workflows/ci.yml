# =============================================================================
# CI Pipeline — Banking Data Platform
# =============================================================================
# Trigger: Push to main, Pull Request
# Steps: Lint → Validate YAML → Test → Coverage
# =============================================================================

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Job 1: Lint & Format Check
  # ===========================================================================
  lint:
    name: 🔍 Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff check
        run: |
          echo "=== Running ruff check ==="
          ruff check governance/ code_etl/ tests/ --output-format=github || true
          echo "=== Ruff check complete ==="

      - name: Run ruff format check
        run: |
          echo "=== Running ruff format check ==="
          ruff format --check governance/ code_etl/ tests/ || true
          echo "=== Format check complete ==="

  # ===========================================================================
  # Job 2: Validate YAML Configs
  # ===========================================================================
  validate-yaml:
    name: 📋 Validate YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pydantic

      - name: Validate ETL YAML configs
        run: |
          echo "=== Validating Bronze YAML configs ==="
          python -c "
          import yaml
          from pathlib import Path
          errors = []
          for yaml_file in Path('code_etl/bronze').rglob('*.yml'):
              try:
                  with open(yaml_file) as f:
                      yaml.safe_load(f)
                  print(f'  ✅ {yaml_file.name}')
              except Exception as e:
                  errors.append(f'{yaml_file}: {e}')
                  print(f'  ❌ {yaml_file.name}: {e}')

          print()
          print('=== Validating Silver YAML configs ===')
          for yaml_file in Path('code_etl/silver').rglob('*.yml'):
              try:
                  with open(yaml_file) as f:
                      yaml.safe_load(f)
                  print(f'  ✅ {yaml_file.name}')
              except Exception as e:
                  errors.append(f'{yaml_file}: {e}')
                  print(f'  ❌ {yaml_file.name}: {e}')

          print()
          print('=== Validating Gold YAML configs ===')
          for yaml_file in Path('code_etl/gold').rglob('*.yml'):
              try:
                  with open(yaml_file) as f:
                      yaml.safe_load(f)
                  print(f'  ✅ {yaml_file.name}')
              except Exception as e:
                  errors.append(f'{yaml_file}: {e}')
                  print(f'  ❌ {yaml_file.name}: {e}')

          print()
          if errors:
              print(f'❌ {len(errors)} YAML validation errors found')
              for err in errors:
                  print(f'  - {err}')
              exit(1)
          else:
              print('✅ All YAML configs are valid')
          "

      - name: Validate Data Contract YAMLs
        run: |
          echo "=== Validating Data Contract YAMLs ==="
          python -c "
          import yaml
          from pathlib import Path
          errors = []
          for yaml_file in Path('governance/datasets').glob('*.yaml'):
              try:
                  with open(yaml_file) as f:
                      data = yaml.safe_load(f)
                  # Check required fields
                  required = ['dataset_id', 'owner', 'business_purpose', 'layer', 'physical_location']
                  for field in required:
                      if field not in data:
                          errors.append(f'{yaml_file.name}: missing field \"{field}\"')
                  print(f'  ✅ {yaml_file.name}')
              except Exception as e:
                  errors.append(f'{yaml_file}: {e}')
                  print(f'  ❌ {yaml_file.name}: {e}')

          print()
          if errors:
              print(f'❌ {len(errors)} contract validation errors found')
              for err in errors:
                  print(f'  - {err}')
              exit(1)
          else:
              print('✅ All data contracts are valid')
          "

  # ===========================================================================
  # Job 3: Unit Tests
  # ===========================================================================
  # Fast tests: unit tests + static Gold SQL invariants (không cần Spark, ~vài giây).
  # Executable Gold regression nằm ở job gold-spark-regression bên dưới.
  test:
    name: 🧪 Unit Tests + SQL Invariants
    runs-on: ubuntu-latest
    needs: [lint, validate-yaml]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pydantic pytest pytest-cov jinja2

      - name: Run unit tests
        run: |
          echo "=== Running unit tests ==="
          python -m pytest tests/ \
            -v \
            --tb=short \
            -m "not integration" \
            --cov=governance \
            --cov=code_etl/shared \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --junitxml=junit-results.xml

      # README là PROJECTION của evidence manifest, không phải nơi định nghĩa
      # metric. Bước này fail khi hai bên lệch, nên một con số không thể bị sửa
      # tay trong README rồi âm thầm khác với thứ đã đo.
      - name: Verify README ↔ metrics manifest
        run: |
          echo "=== README metric drift check ==="
          python scripts/verify_readme_metrics.py

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            junit-results.xml
            htmlcov/

  # ===========================================================================
  # Job 3b: Gold Spark Regression
  # ===========================================================================
  # Tách khỏi Unit Tests vì job này cần boot Spark (~2 phút) trong khi unit
  # tests chỉ mất vài giây. Đổi lại, nó bắt được lớp bug đã từng làm metric
  # sai 29× (fan-out grain + double count qua nhiều cob_dt snapshot).
  #
  # PySpark pin 3.5.3 = đúng runtime của cluster trong docker-compose.
  # Local dev có thể chạy bản mới hơn, nhưng regression gate phải bám runtime
  # target để không hợp thức hoá hành vi chỉ đúng trên bản khác.
  #
  # Path filter đặt Ở TRONG job, không phải ở `on.pull_request.paths`.
  # Lý do: job này dự kiến là required check. Nếu lọc ở workflow level thì khi
  # path không khớp, workflow không chạy → required check không bao giờ report
  # → PR bị chặn vĩnh viễn. Gate bên trong job thì job luôn report, chỉ bỏ qua
  # phần tốn thời gian (boot Spark).
  gold-spark-regression:
    name: 🔬 Gold Spark Regression
    runs-on: ubuntu-latest
    needs: [lint, validate-yaml]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if Gold logic changed
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Not a PR — chạy đầy đủ."
            exit 0
          fi
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "$CHANGED"
          # spark_session.py và spark-defaults.conf nằm trong gate vì
          # test_business_date_semantics.py assert trực tiếp lên chúng: guard
          # assert_utc_session() và dòng spark.sql.session.timeZone=UTC. Nếu
          # không liệt kê, một PR chỉ sửa timezone sẽ bỏ qua đúng job canh nó.
          if echo "$CHANGED" | grep -qE '^(code_etl/gold/|code_etl/shared/spark/|tests/gold/|docker/spark/conf/|\.github/workflows/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Không đụng Gold logic — bỏ qua Spark regression."
          fi

      - name: Setup Java 17
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          # jinja2: gold_job.py -> utils/yaml_loader.py render SQL bằng Template.
          # Case 6 nạp gold_job thật để test guard fail-loud, nên nó là dependency
          # thật của job này, không phải thứ stub được.
          pip install pyyaml pytest jinja2 'pyspark==3.5.3'

      - name: Run Gold regression (executable)
        if: steps.gate.outputs.run == 'true'
        run: |
          echo "=== Gold Spark regression — fan-out, snapshot, business-date ==="
          # 23 fan-out/snapshot + 9 business-date semantics = 32 test.
          # Nhóm business-date canh thay đổi kiến trúc lớn nhất của v1.1 (engine
          # chạy UTC, business date derive tường minh sang ICT) và chỉ cần
          # pyspark — job này đã có sẵn, nên đưa vào đây thay vì dựng job mới.
          python -m pytest \
            tests/gold/test_gold_fanout_regression.py \
            tests/gold/test_business_date_semantics.py \
            -v --tb=short -m integration \
            --junitxml=gold-regression-results.xml

      - name: Upload regression results
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gold-regression-results
          path: gold-regression-results.xml

  # ===========================================================================
  # Job 4: Validate Governance Module
  # ===========================================================================
  validate-governance:
    name: 🏛️ Validate Governance
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pydantic

      - name: Validate governance contracts
        run: |
          echo "=== Validating governance contracts ==="
          python -c "
          import sys
          sys.path.insert(0, '.')
          from governance.contracts_registry import ContractRegistry

          registry = ContractRegistry('governance/datasets')
          print(registry.summary())

          if registry.has_errors:
              print('❌ Contract loading errors found')
              for err in registry.errors:
                  print(f'  - {err}')
              exit(1)

          issues = registry.validate_all()
          if issues:
              print('❌ Contract validation issues found')
              for issue in issues:
                  print(f'  - {issue}')
              exit(1)

          print('✅ All governance contracts validated successfully')
          "

  # ===========================================================================
  # Job 5: Check Docker Compose
  # ===========================================================================
  validate-docker:
    name: 🐳 Validate Docker
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          echo "=== Validating Docker Compose ==="
          cd docker
          # Create .env with dummy values for CI validation
          cat > .env << 'EOF'
          POSTGRES_USER=ci_user
          POSTGRES_PASSWORD=ci_password
          POSTGRES_DB=ci_db
          MINIO_ROOT_USER=ci_minio_user
          MINIO_ROOT_PASSWORD=ci_minio_password
          MINIO_BUCKET=ci-bucket
          AIRFLOW_FERNET_KEY=ci_fernet_key
          AIRFLOW_SECRET_KEY=ci_secret_key
          AIRFLOW_DB=ci_airflow_db
          AIRFLOW_ADMIN_USER=admin
          AIRFLOW_ADMIN_PASSWORD=admin
          AIRFLOW_ADMIN_EMAIL=admin@example.com
          EOF
          docker compose config --quiet
          echo "✅ Docker Compose config is valid"

      - name: Check Dockerfile syntax
        run: |
          echo "=== Checking Dockerfiles ==="
          for dockerfile in docker/Dockerfile.*; do
              if [ -f "$dockerfile" ]; then
                  echo "Checking $dockerfile..."
                  docker build --check "$dockerfile" 2>/dev/null || echo "  ⚠️  Cannot validate $dockerfile (buildx required)"
              fi
          done
          echo "✅ Dockerfile check complete"

  # ===========================================================================
  # Job 6: Security Scan
  # ===========================================================================
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (Dockerfiles)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'docker/'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Run Bandit Python security scan
        run: |
          echo "=== Running Bandit security scan ==="
          pip install bandit
          bandit -r code_etl/ governance/ -f json -o bandit-report.json --severity-level medium || true
          bandit -r code_etl/ governance/ -f screen --severity-level medium || true
          echo "✅ Bandit scan complete"

      - name: Check for hardcoded secrets
        run: |
          echo "=== Checking for hardcoded secrets ==="
          # Check for common secret patterns
          if grep -r "password\s*=\s*['\"]" code_etl/ governance/ --include="*.py" | grep -v "getenv\|environ\|\.env\|example\|test\|mock" | head -5; then
            echo "⚠️  Potential hardcoded passwords found"
          else
            echo "✅ No hardcoded passwords found"
          fi

          if grep -r "api_key\s*=\s*['\"]" code_etl/ governance/ --include="*.py" | grep -v "getenv\|environ\|\.env\|example\|test\|mock" | head -5; then
            echo "⚠️  Potential hardcoded API keys found"
          else
            echo "✅ No hardcoded API keys found"
          fi

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: bandit-report.json
