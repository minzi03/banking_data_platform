# =============================================================================
# Pre-commit Hooks — Banking Data Platform
# =============================================================================
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files
# =============================================================================

repos:
  # ---------------------------------------------------------------------------
  # General file hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: check-case-conflict

  # ---------------------------------------------------------------------------
  # Ruff — lint + format (replaces flake8, isort, black)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      # Linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(code_etl|data_generator|api|ml|tests|governance)/
      # Formatter
      - id: ruff-format
        files: ^(code_etl|data_generator|api|ml|tests|governance)/

  # ---------------------------------------------------------------------------
  # YAML format enforcement for ETL configs
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        name: validate ETL YAML configs
        files: ^code_etl/.*\.yml$
        args: [--unsafe]  # allow Jinja {{ }} in SQL templates

  # ---------------------------------------------------------------------------
  # Commit message convention (optional, helps changelog generation)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.27.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
