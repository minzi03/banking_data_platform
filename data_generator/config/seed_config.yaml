# =============================================================================
# Seed Data Configuration — Banking Data Platform
# Controls row counts, date ranges, and distribution parameters
# =============================================================================

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------
# ⚠ Ba khoá dưới KHÔNG được code nào đọc — giữ lại chỉ để không phá ai đang
# tham chiếu. Ngày của dữ liệu do `--as-of` quyết định (mặc định: hôm nay):
# giao dịch mới nhất = as_of, mọi ngày khác dời theo cùng độ lệch.
# Xem data_generator/generators/timeline.py.
data:
  seed_date: "2025-12-31"          # không dùng — xem --as-of
  start_date: "2020-01-01"         # không dùng — xem --as-of
  end_date: "2025-12-31"           # không dùng — xem --as-of

# -----------------------------------------------------------------------------
# core_banking schema
# -----------------------------------------------------------------------------
core_banking:
  branch:
    row_count: 100
    regions: ["NORTH", "CENTRAL", "SOUTH"]
    region_weights: [0.35, 0.20, 0.45]    # North 35%, Central 20%, South 45%
    status: ["ACTIVE", "CLOSED"]
    status_weights: [0.92, 0.08]

  product:
    row_count: 30
    products:
      - code: "CASA001"
        name: "Current Account"
        group: "DEPOSIT"
        type: "CASA"
        currency: "VND"
      - code: "SAV001"
        name: "Standard Savings"
        group: "DEPOSIT"
        type: "SAVINGS"
        currency: "VND"
      - code: "SAV002"
        name: "High-Yield Savings"
        group: "DEPOSIT"
        type: "SAVINGS"
        currency: "VND"
      - code: "SAV003"
        name: "Online Savings"
        group: "DEPOSIT"
        type: "SAVINGS"
        currency: "VND"
      - code: "LOAN001"
        name: "Personal Loan"
        group: "LOAN"
        type: "PERSONAL_LOAN"
        currency: "VND"
      - code: "LOAN002"
        name: "Home Mortgage"
        group: "LOAN"
        type: "MORTGAGE"
        currency: "VND"
      - code: "LOAN003"
        name: "Auto Loan"
        group: "LOAN"
        type: "PERSONAL_LOAN"
        currency: "VND"
      - code: "LOAN004"
        name: "Business Loan"
        group: "LOAN"
        type: "PERSONAL_LOAN"
        currency: "VND"
      - code: "CRD001"
        name: "Classic Credit Card"
        group: "CARD"
        type: "CREDIT_CARD"
        currency: "VND"
      - code: "CRD002"
        name: "Gold Credit Card"
        group: "CARD"
        type: "CREDIT_CARD"
        currency: "VND"
      - code: "CRD003"
        name: "Platinum Credit Card"
        group: "CARD"
        type: "CREDIT_CARD"
        currency: "VND"
      - code: "CRD004"
        name: "Visa Debit Card"
        group: "CARD"
        type: "DEBIT_CARD"
        currency: "VND"
      - code: "CRD005"
        name: "Mastercard Debit"
        group: "CARD"
        type: "DEBIT_CARD"
        currency: "VND"

  customer:
    row_count: 10000
    gender_distribution: {"M": 0.52, "F": 0.46, "O": 0.02}
    segment_distribution: {"RETAIL": 0.70, "PRIORITY": 0.22, "VIP": 0.08}
    kyc_distribution: {"VERIFIED": 0.85, "PENDING": 0.10, "REJECTED": 0.05}
    active_rate: 0.94
    birth_date_range: ["1955-01-01", "2005-12-31"]
    cities: ["Hanoi", "HCM", "Da Nang", "Hai Phong", "Can Tho", "Bien Hoa",
             "Nha Trang", "Vung Tau", "Hue", "Quy Nhon"]
    default_segment: "RETAIL"

  account:
    row_count: 30000
    account_type_distribution: {"CASA": 0.55, "TIME_DEPOSIT": 0.45}
    status_distribution: {"ACTIVE": 0.80, "CLOSED": 0.15, "FROZEN": 0.05}
    balance_range_casa: [100000, 500000000]      # VND
    balance_range_td: [10000000, 1000000000]     # VND

  deposit:
    row_count: 15000
    term_options: [1, 3, 6, 12, 24, 36]
    rate_range: [3.0, 8.5]                       # % per year
    principal_range: [5000000, 1000000000]        # VND
    status_distribution: {"ACTIVE": 0.60, "MATURED": 0.30, "EARLY_WITHDRAWN": 0.10}

  loan:
    row_count: 5000
    loan_amount_range: [10000000, 5000000000]    # VND
    rate_range: [6.0, 15.0]                       # % per year
    term_options: [6, 12, 24, 36, 60, 120]
    status_distribution: {"ACTIVE": 0.55, "CLOSED": 0.30, "OVERDUE": 0.10, "WRITTEN_OFF": 0.05}

  txn_account:
    row_count: 1200000
    type_distribution:
      {"DEPOSIT": 0.15, "WITHDRAWAL": 0.15, "TRANSFER_IN": 0.25,
       "TRANSFER_OUT": 0.25, "FEE": 0.10, "INTEREST": 0.10}
    dc_distribution: {"D": 0.55, "C": 0.45}
    channel_distribution:
      {"BRANCH": 0.05, "ATM": 0.15, "INTERNET_BANKING": 0.25,
       "MOBILE_BANKING": 0.50, "POS": 0.05}
    amount_range: [10000, 500000000]             # VND — dải kẹp
    # Log-normal thay uniform. Xem data_generator/generators/amounts.py:
    # uniform cho median 250tr, làm high_value_flag (>=200tr) gắn cờ 60%.
    amount_profile:
      median:   2000000      # giao dịch điển hình 2tr
      p99:    200000000      # khớp ngưỡng high_value_flag → gắn cờ ~1%
      min:         10000
      max:     500000000

  employee:
    row_count: 1800
    role_distribution: {"TELLER": 0.40, "MANAGER": 0.20, "ANALYST": 0.30, "DIRECTOR": 0.10}
    salary_range: [8000000, 80000000]            # VND monthly
    active_rate: 0.90

  loan_payment:
    late_payment_rate: 0.05                     # 5% chance of late payment
    missed_payment_rate: 0.02                   # 2% chance of missed payment

  standing_order:
    row_count: 15000
    frequency_distribution: {"MONTHLY": 0.60, "WEEKLY": 0.25, "QUARTERLY": 0.15}
    status_distribution: {"ACTIVE": 0.70, "PAUSED": 0.15, "CANCELLED": 0.15}

# -----------------------------------------------------------------------------
# card_crm schema
# -----------------------------------------------------------------------------
card_crm:
  card:
    row_count: 6000
    type_distribution: {"DEBIT": 0.55, "CREDIT": 0.40, "PREPAID": 0.05}
    brand_distribution: {"VISA": 0.40, "MASTER": 0.30, "JCB": 0.15, "NAPAS": 0.15}
    credit_limit_range: [5000000, 200000000]     # VND
    status_distribution: {"ACTIVE": 0.75, "BLOCKED": 0.05, "EXPIRED": 0.12, "CLOSED": 0.08}
    expiry_months_range: [12, 60]                 # months from issue

  card_txn:
    row_count: 600000
    type_distribution: {"PURCHASE": 0.70, "CASH_ADVANCE": 0.15, "REFUND": 0.10, "REVERSAL": 0.05}
    channel_distribution: {"POS": 0.45, "ECOM": 0.40, "ATM": 0.15}
    status_distribution: {"SUCCESS": 0.90, "FAILED": 0.07, "PENDING": 0.03}
    amount_range: [50000, 50000000]               # VND — dải kẹp
    amount_profile:
      median:    500000      # chi tiêu thẻ điển hình 500k
      p99:     20000000
      min:        50000
      max:     50000000
    merchant_categories: ["GROCERY", "RESTAURANT", "TRAVEL", "ECOM", "FUEL",
                          "EDUCATION", "HEALTHCARE", "ENTERTAINMENT", "UTILITIES"]

  crm_interaction:
    row_count: 50000
    channel_distribution: {"CALL": 0.30, "EMAIL": 0.20, "CHAT": 0.25, "BRANCH": 0.15, "SMS": 0.10}
    direction_distribution: {"INBOUND": 0.60, "OUTBOUND": 0.40}
    category_distribution: {"COMPLAINT": 0.20, "INQUIRY": 0.30, "CAMPAIGN": 0.20,
                            "CROSS_SELL": 0.15, "RETENTION": 0.15}
    status_distribution: {"OPEN": 0.10, "RESOLVED": 0.75, "PENDING": 0.15}

# -----------------------------------------------------------------------------
# digital_banking schema
# -----------------------------------------------------------------------------
digital_banking:
  device:
    row_count: 50000
    type_distribution: {"MOBILE": 0.65, "TABLET": 0.15, "DESKTOP": 0.20}
    os_options: ["iOS", "Android", "Windows", "macOS", "Linux"]
    trusted_rate: 0.40

  location:
    row_count: 5000
    cities: ["Hanoi", "HCM", "Da Nang", "Hai Phong", "Can Tho",
             "Bien Hoa", "Nha Trang", "Vung Tau", "Hue", "Quy Nhon"]
    high_risk_rate: 0.05
    merchant_categories: ["grocery", "restaurant", "travel", "ecom", "fuel",
                          "education", "healthcare", "entertainment", "utilities",
                          "fashion", "electronics", "home_improvement"]

  online_transaction:
    row_count: 500000
    type_distribution: {"PURCHASE": 0.35, "TRANSFER": 0.30, "PAYMENT": 0.20,
                         "WITHDRAWAL": 0.10, "TOP_UP": 0.05}
    channel_distribution: {"MOBILE_APP": 0.55, "WEB": 0.25, "API": 0.10, "POS": 0.10}
    status_distribution: {"SUCCESS": 0.92, "FAILED": 0.05, "PENDING": 0.03}
    fraud_rate: 0.008                             # ~0.8% fraudulent
    amount_range: [10000, 100000000]              # VND — dải kẹp
    amount_profile:
      median:   1000000
      p99:     50000000
      min:        10000
      max:    100000000

  support_ticket:
    row_count: 25000
    issue_types: ["TRANSACTION_DISPUTE", "ACCOUNT_ACCESS", "CARD_BLOCK",
                  "GENERAL_INQUIRY", "FEEDBACK"]
    priority_distribution: {"LOW": 0.20, "MEDIUM": 0.45, "HIGH": 0.25, "URGENT": 0.10}
    status_distribution: {"OPEN": 0.08, "IN_PROGRESS": 0.12, "RESOLVED": 0.55, "CLOSED": 0.25}
    satisfaction_range: [1, 5]

  mcc_code:
    # Mã MCC theo danh sách mã của Visa/Mastercard (ISO 18245). Số dòng = số mã
    # khai ở đây — generator KHÔNG độn thêm. Bản trước khai 28 mã rồi độn 81 mã
    # số ngẫu nhiên 1000–9999 cho đủ 109, nên 74% bảng là mã không tồn tại.
    #
    # Tập mã = 75 mã xuất hiện trong giao dịch thẻ thật của bộ tham khảo Xóm Bank
    # (thamkhao/dataset_thamkhao/thamkhao/mcc_codes_*.csv) ∪ 8 mã generator đã dùng
    # mà Xóm không có ∪ 7512 (thuê xe, thay mã chuỗi 3351). Mô tả viết lại theo
    # danh sách mã thẻ, không lấy của Xóm nguyên trạng. Bỏ 34 mã của Xóm:
    #   3000–3780  Xóm ghi "Steelworks", "Welding Repair"…; theo danh sách mã thẻ,
    #              3000–3299 là từng hãng bay, 3351–3441 hãng thuê xe, 3501–3999
    #              chuỗi khách sạn — dùng mã chung 4511 / 7512 / 7011 thay thế.
    #   7801–7802  Xóm ghi "Athletic Fields", "Recreational Sports"; 7800–7802
    #              là xổ số / casino trực tuyến / đua ngựa do chính phủ cấp phép.
    # risk = 1: nhóm MCC các mạng thẻ xếp rủi ro cao (quasi-cash, rút tiền mặt,
    # chuyển tiền, cá cược, hẹn hò, telemarketing).
    codes:
      - {mcc: "1711", desc: "Heating, Plumbing and Air Conditioning Contractors", group: "SERVICES", risk: 0}
      - {mcc: "4111", desc: "Local and Suburban Commuter Passenger Transportation", group: "TRAVEL", risk: 0}
      - {mcc: "4112", desc: "Passenger Railways", group: "TRAVEL", risk: 0}
      - {mcc: "4121", desc: "Taxicabs and Limousines", group: "TRAVEL", risk: 0}
      - {mcc: "4131", desc: "Bus Lines", group: "TRAVEL", risk: 0}
      - {mcc: "4214", desc: "Motor Freight Carriers and Trucking", group: "SERVICES", risk: 0}
      - {mcc: "4411", desc: "Cruise Lines", group: "TRAVEL", risk: 0}
      - {mcc: "4511", desc: "Airlines and Air Carriers", group: "TRAVEL", risk: 0}
      - {mcc: "4722", desc: "Travel Agencies and Tour Operators", group: "TRAVEL", risk: 0}
      - {mcc: "4784", desc: "Tolls and Bridge Fees", group: "TRAVEL", risk: 0}
      - {mcc: "4814", desc: "Telecommunication Services", group: "UTILITIES", risk: 0}
      - {mcc: "4829", desc: "Wire Transfers and Money Orders", group: "SERVICES", risk: 1}
      - {mcc: "4899", desc: "Cable, Satellite and Other Pay Television Services", group: "UTILITIES", risk: 0}
