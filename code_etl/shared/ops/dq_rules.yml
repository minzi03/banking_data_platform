# =============================================================================
# Data Quality Rules — Banking Data Platform
# =============================================================================
# Check types:
#   row_count         - min/max row count threshold
#   null_check        - columns must not be NULL
#   unique_check      - columns must be unique
#   range_check       - numeric column within min/max bounds
#   referential_integrity - FK exists in referenced table
#   freshness         - data within N days of current date
#
# Severity: FAIL = blocks pipeline, WARN = logs but passes
# =============================================================================

# ---------------------------------------------------------------------------
# SILVER DIMENSIONS
# ---------------------------------------------------------------------------
tables:

  # --- dim_customer (SCD2) ---
  lakehouse.silver.dim_customer:
    checks:
      - name: row_count
        severity: FAIL
        min_rows: 1
      - name: null_check
        severity: FAIL
        columns: [customer_id, cccd, full_name]
      - name: unique_check
        severity: FAIL
        columns: [customer_id]
      - name: null_check
        severity: WARN
        columns: [phone, email, address, city, district, branch_code]
      - name: referential_integrity
        severity: WARN
        column: branch_code
        ref_table: lakehouse.silver.dim_branch
        ref_column: branch_code

  # --- dim_account (SCD2) ---
