# =============================================================================
# CDC Consolidation Config — Customer
# =============================================================================
# Source: Bronze CDC (append-only change history)
# Target: Silver Current State (latest state per customer)
# =============================================================================

source_table: lakehouse.bronze.core_customer_cdc
target_table: lakehouse.silver.dim_customer_current
business_key: customer_id

# Column mappings (source → target)
# Only include columns that exist in both source and target
columns:
  - customer_id
  - cccd
  - full_name
  - gender
  - date_of_birth
  - phone
  - email
  - address
  - city
  - district
  - branch_code
  - customer_segment
  - kyc_status
  - register_date
  - is_active

# Type conversions (Bronze BIGINT/VARCHAR → Silver proper types)
conversions:
  date_of_birth: epoch_days_to_date
  register_date: epoch_days_to_date
  is_active: varchar_to_int
  last_updated: epoch_micros_to_timestamp

# Event ordering (deterministic tie-breaker)
ordering:
  - column: __cdc_timestamp_ms
    direction: desc
  - column: __spark_batch_id
    direction: desc

# CDC metadata columns
metadata:
  operation_column: __cdc_operation
  event_timestamp_column: __cdc_timestamp
  event_timestamp_ms_column: __cdc_timestamp_ms
  batch_id_column: __spark_batch_id

# Retention (optional - for future cleanup)
retention:
  enabled: false
  keep_days: 90
