# =============================================================================
# CDC Configuration — core_account
# =============================================================================
# Source: PostgreSQL core_banking.account via Debezium
# Target: Iceberg bronze.core_account_cdc

kafka:
  topic: postgresql.banking.core_banking.account
  starting_offsets: earliest
  checkpoint_location: s3a://lakehouse/checkpoints/cdc/core_account_v3
  trigger_interval: 30 seconds
  max_offsets_per_trigger: 100000

target:
  catalog: lakehouse
  schema: bronze
  table: core_account_cdc
  # Event thiếu khoá chính → DLQ (MERGE không thể khớp một khoá NULL).
  primary_key: account_id
  columns:
    - name: account_id
      type: long
    - name: account_no
      type: string
    - name: customer_id
      type: long
    - name: product_code
      type: string
    - name: branch_code
      type: string
    - name: account_type
      type: string
    - name: currency
      type: string
    - name: balance
      type: decimal
    - name: open_date
      type: long
    - name: close_date
      type: long
    - name: status
      type: string
    - name: last_updated
      type: long

# ─── Static dimension join (khoá new2 §4.3) ──────────────────────────────────
# Sau khi event hợp lệ vào Bronze (raw), join thêm thuộc tính dimension từ Silver
# và ghi vào bảng enriched RIÊNG. Dimension đọc lại mỗi micro-batch (refresh).
# Bronze KHÔNG đổi — bảng enriched chỉ để phục vụ đọc gần thời gian thực.
enrichment:
  target_table: lakehouse.silver.stream_enriched_account
  joins:
    - dim_table: lakehouse.silver.dim_branch
      on:
        - [branch_code, branch_code]
      columns: [branch_name, region, city]
      prefix: br_
