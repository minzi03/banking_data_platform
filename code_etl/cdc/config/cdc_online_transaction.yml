# CDC Configuration — online_transaction
# Source: PostgreSQL digital_banking.online_transaction via Debezium
# Target: Iceberg bronze.online_transaction_cdc

kafka:
  topic: postgresql.banking.digital_banking.online_transaction
  starting_offsets: earliest
  checkpoint_location: s3a://lakehouse/checkpoints/cdc/online_transaction_v1
  trigger_interval: 30 seconds
  max_offsets_per_trigger: 100000

# Event time + chống trùng (khoá new2 §4.3).
# Debezium bảo đảm at-least-once: một giao dịch phát lại (rebalance, restart từ
# offset cũ, producer retry) sẽ vào Bronze hai lần nếu không dedup. Bronze là
# append-only nên dòng trùng sai vĩnh viễn và làm lệch đối soát cuối ngày.
# Watermark 10 phút: chấp nhận event đến trễ tới 10 phút; quá ngưỡng đó event
# bị coi là quá cũ (không dedup, không còn tính là đúng giờ).
dedup:
  watermark_delay: "10 minutes"
  keys:
    - transaction_id

target:
  catalog: lakehouse
  schema: bronze
  table: online_transaction_cdc
  # Event thiếu khoá chính → DLQ (MERGE không thể khớp một khoá NULL).
  primary_key: transaction_id
  columns:
    - name: transaction_id
      type: long
    - name: account_id
      type: long
    - name: device_id
      type: long
    - name: location_id
      type: long
    - name: customer_id
      type: long
    - name: transaction_type
      type: string
    - name: channel
      type: string
    - name: amount
      type: decimal
    - name: currency
      type: string
    - name: is_fraud
      type: string
    - name: fraud_reason
      type: string
    - name: status
      type: string
    # Merchant QR/POS (khoá new2) — thiếu 3 cột này thì giao dịch QR/POS chảy
    # qua CDC sẽ mất merchant_id/payment_channel, và mọi aggregate real-time
    # theo merchant (doanh thu/phút, giờ cao điểm) không thể tính.
    - name: merchant_id
      type: long
    - name: payment_channel
      type: string
    - name: refund_flag
      type: int
    - name: transaction_date
      type: long
    - name: created_ts
      type: long
    - name: last_updated
      type: long
