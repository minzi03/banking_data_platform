# Silver: dim_branch (SCD Type 2 — full history; last_updated là cột Type 1)
job:
  type: scd_type2

source:
  tables:
    - bronze.core_branch

target:
  catalog: lakehouse
  schema: silver
  table: dim_branch

business_key:
  - branch_code

scd:
  type: 2
  effective_from_column: effective_from
  effective_to_column: effective_to
  current_flag_column: is_current
  sk_column: branch_sk
  # Full snapshot: key biến mất khỏi nguồn = bản ghi đã bị xoá → đóng version.
  close_missing_keys: true

# Đề bài yêu cầu lưu lịch sử thay đổi của product/branch. Trước đây bảng này là
# SCD1 (ghi đè), nên lịch sử mất hẳn. Cột không liệt kê ở đây (last_updated) được
# ghi đè tại chỗ trên version hiện hành (Type 1).
tracked_columns:
  - branch_name
  - region
  - city
  - district
  - address
  - manager_name
  - open_date
  - status

sql: |
  SELECT
      branch_code,
      branch_name,
      region,
      city,
      district,
      address,
      manager_name,
      open_date,
      status,
      last_updated
  FROM lakehouse.bronze.core_branch
  WHERE cob_dt = DATE '{{ cob_dt }}'
