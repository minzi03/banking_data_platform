# Silver: fact_txn_account (overwritePartitions by cob_dt)
# Joins: dim_account (account_sk) + dim_customer (customer_sk)
job:
  type: fact_txn
  # Bronze nguồn nạp theo ngày nghiệp vụ (ADR-0018): partition cob_dt = ngày ICT của
  # giao dịch. Hằng ngày from_dt = cob_dt (một partition); nạp lịch sử: --backfill_from.
  incremental: true

source:
  tables:
    - bronze.core_txn_account
    - silver.dim_account
    - silver.dim_customer

target:
  catalog: lakehouse
  schema: silver
  table: fact_txn_account

business_key:
  - txn_id

sql: |
  SELECT
      t.txn_id,
      t.account_id,
      a.account_sk,
      t.customer_id,
      c.customer_sk,
      t.txn_date,
      t.txn_amount,
      t.txn_type,
      t.debit_credit,
      t.balance_after,
      t.channel,
      t.description,
      t.counter_account,
      t.created_ts,
      t.cob_dt
  FROM lakehouse.bronze.core_txn_account t
  LEFT JOIN lakehouse.silver.dim_account a
      ON t.account_id = a.account_id
      AND DATE '{{ cob_dt }}' BETWEEN a.effective_from AND a.effective_to
  LEFT JOIN lakehouse.silver.dim_customer c
      ON t.customer_id = c.customer_id
      AND DATE '{{ cob_dt }}' BETWEEN c.effective_from AND c.effective_to
  WHERE t.cob_dt BETWEEN DATE '{{ from_dt }}' AND DATE '{{ cob_dt }}'
