# Silver: fact_online_transaction (overwritePartitions by cob_dt)
# Joins: dim_customer (customer_sk).
#
# device_id và location_id được giữ nguyên dạng FK, KHÔNG join dim ở tầng này —
# fact giữ khoá, dim được join ở Gold khi cần thuộc tính. Trước đây
# silver.dim_device và silver.dim_location bị khai báo nhầm trong source.tables
# (và header ghi "Joins: ... dim_device + dim_location") dù SQL không hề đọc
# chúng: khai báo sai làm lineage sai và có thể biến thành lỗi giả nếu về sau
# thêm require_snapshots. Xem tests/governance/test_declared_sources_match_sql.py
#
# Hai dim này hiện chưa có consumer nào ở Gold — việc dùng chúng nằm ở
# docs/ROADMAP.md mục 2.1 (geo_velocity_flag cho aml_monitoring).
job:
  type: fact_txn

source:
  tables:
    - bronze.core_online_transaction
    - silver.dim_customer

target:
  catalog: lakehouse
  schema: silver
  table: fact_online_transaction

business_key:
  - transaction_id

sql: |
  SELECT
      t.transaction_id,
      t.account_id,
      t.device_id,
      t.location_id,
      t.customer_id,
      c.customer_sk,
      t.transaction_type,
      t.channel,
      t.amount,
      t.currency,
      t.is_fraud,
      t.fraud_reason,
      t.status,
      t.transaction_date,
      t.created_ts,
      t.cob_dt
  FROM lakehouse.bronze.core_online_transaction t
  LEFT JOIN lakehouse.silver.dim_customer c
      ON t.customer_id = c.customer_id
      AND c.is_current = 1
  WHERE t.cob_dt = DATE '{{ cob_dt }}'
