# Silver: fact_card_txn (overwritePartitions by cob_dt)
# Joins: dim_customer (customer_sk)
job:
  type: fact_txn
  # Bronze nguồn nạp theo ngày nghiệp vụ (ADR-0018): partition cob_dt = ngày ICT của
  # giao dịch. Hằng ngày from_dt = cob_dt (một partition); nạp lịch sử: --backfill_from.
  incremental: true

source:
  tables:
    - bronze.core_card_txn
    - silver.dim_customer

target:
  catalog: lakehouse
  schema: silver
  table: fact_card_txn

business_key:
  - txn_id

sql: |
  SELECT
      t.txn_id,
      t.card_id,
      t.customer_id,
      c.customer_sk,
      t.txn_date,
      t.txn_amount,
      t.txn_type,
      t.currency,
      t.merchant_name,
      t.merchant_category,
      t.channel,
      t.status,
      t.entry_mode,
      t.decline_reason,
      t.created_ts,
      t.cob_dt
  FROM lakehouse.bronze.core_card_txn t
  LEFT JOIN lakehouse.silver.dim_customer c
      ON t.customer_id = c.customer_id
      AND DATE '{{ cob_dt }}' BETWEEN c.effective_from AND c.effective_to
  WHERE t.cob_dt BETWEEN DATE '{{ from_dt }}' AND DATE '{{ cob_dt }}'
