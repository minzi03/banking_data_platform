# Bronze Ingestion: online_transaction (fact — full load for bootstrap)
source:
  type: postgresql
  schema: digital_banking
  fetchsize: 50000

target:
  catalog: lakehouse
  schema: bronze
  table: core_online_transaction

load:
  strategy: full_snapshot

sql: |
  SELECT
    transaction_id,
    account_id,
    device_id,
    location_id,
    customer_id,
    transaction_type,
    channel,
    amount,
    currency,
    is_fraud,
    fraud_reason,
    status,
    transaction_date,
    created_ts,
    last_updated
  FROM digital_banking.online_transaction
