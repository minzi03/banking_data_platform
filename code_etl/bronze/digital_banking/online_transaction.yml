# Bronze Ingestion: online_transaction (fact — incremental theo ngày nghiệp vụ, ADR-0018)
source:
  type: postgresql
  schema: digital_banking
  fetchsize: 50000

target:
  catalog: lakehouse
  schema: bronze
  table: core_online_transaction

load:
  # Mỗi cob_dt chỉ nạp giao dịch có NGÀY NGHIỆP VỤ (ICT) = cob_dt; partition cob_dt của
  # bảng là ngày nghiệp vụ của giao dịch. Nạp lịch sử lần đầu: --backfill_from (ADR-0018).
  strategy: incremental
  cob_dt_from_column: cob_dt

sql: |
  SELECT
    transaction_id,
    account_id,
    device_id,
    location_id,
    customer_id,
    transaction_type,
    channel,
    amount,
    currency,
    is_fraud,
    fraud_reason,
    status,
    transaction_date,
    created_ts,
    last_updated,
    -- transaction_date lưu UTC (ADR-0004); ngày nghiệp vụ = ngày theo giờ Asia/Ho_Chi_Minh.
    (timezone('Asia/Ho_Chi_Minh', timezone('UTC', transaction_date)))::date AS cob_dt
  FROM digital_banking.online_transaction
  -- Cửa sổ [window_start, window_end) theo nửa đêm giờ ICT, đổi sang UTC để so với cột.
  WHERE transaction_date >= timezone('UTC', timezone('Asia/Ho_Chi_Minh', TIMESTAMP '{{ window_start }}'))
    AND transaction_date <  timezone('UTC', timezone('Asia/Ho_Chi_Minh', TIMESTAMP '{{ window_end }}'))
