# Bronze Ingestion: device (dimension — full snapshot)
source:
  type: postgresql
  schema: digital_banking
  fetchsize: 10000

target:
  catalog: lakehouse
  schema: bronze
  table: core_device

load:
  strategy: full_snapshot

sql: |
  SELECT
    device_id,
    customer_id,
    device_type,
    device_fingerprint,
    operating_system,
    ip_address,
    is_trusted,
    first_seen,
    last_seen,
    last_updated
  FROM digital_banking.device
