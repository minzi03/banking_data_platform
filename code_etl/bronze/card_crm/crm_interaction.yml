# Bronze Ingestion: crm_interaction (dimension — full snapshot)
source:
  type: postgresql
  schema: card_crm
  fetchsize: 10000

target:
  catalog: lakehouse
  schema: bronze
  table: core_crm_interaction

load:
  strategy: full_snapshot

sql: |
  SELECT
    interaction_id,
    customer_id,
    interaction_date,
    channel,
    direction,
    subject,
    category,
    status,
    assigned_to,
    satisfaction_score,
    created_ts,
    last_updated
  FROM card_crm.crm_interaction
