# Bronze Ingestion: employee (dimension — full snapshot)
source:
  type: postgresql
  schema: core_banking
  fetchsize: 10000

target:
  catalog: lakehouse
  schema: bronze
  table: core_employee

load:
  strategy: full_snapshot

sql: |
  SELECT
    employee_id,
    full_name,
    branch_code,
    role,
    hire_date,
    salary,
    status,
    last_updated
  FROM core_banking.employee
