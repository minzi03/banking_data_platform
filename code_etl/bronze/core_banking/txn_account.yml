# Bronze Ingestion: txn_account (fact — incremental theo ngày nghiệp vụ, ADR-0018)
source:
  type: postgresql
  schema: core_banking
  fetchsize: 50000

target:
  catalog: lakehouse
  schema: bronze
  table: core_txn_account

load:
  # Mỗi cob_dt chỉ nạp giao dịch có NGÀY NGHIỆP VỤ (ICT) = cob_dt; partition cob_dt của
  # bảng là ngày nghiệp vụ của giao dịch. Nạp lịch sử lần đầu: --backfill_from (ADR-0018).
  strategy: incremental
  cob_dt_from_column: cob_dt

sql: |
  SELECT
    txn_id,
    account_id,
    customer_id,
    txn_date,
    txn_amount,
    txn_type,
    debit_credit,
    balance_after,
    channel,
    description,
    counter_account,
    created_ts,
    last_updated,
    -- txn_date lưu UTC (ADR-0004); ngày nghiệp vụ = ngày theo giờ Asia/Ho_Chi_Minh.
    (timezone('Asia/Ho_Chi_Minh', timezone('UTC', txn_date)))::date AS cob_dt
  FROM core_banking.txn_account
  -- Cửa sổ [window_start, window_end) theo nửa đêm giờ ICT, đổi sang UTC để so với cột.
  WHERE txn_date >= timezone('UTC', timezone('Asia/Ho_Chi_Minh', TIMESTAMP '{{ window_start }}'))
    AND txn_date <  timezone('UTC', timezone('Asia/Ho_Chi_Minh', TIMESTAMP '{{ window_end }}'))
