# Bronze Ingestion: txn_account (fact — full load for bootstrap)
source:
  type: postgresql
  schema: core_banking
  fetchsize: 50000

target:
  catalog: lakehouse
  schema: bronze
  table: core_txn_account

load:
  strategy: full_snapshot

sql: |
  SELECT
    txn_id,
    account_id,
    customer_id,
    txn_date,
    txn_amount,
    txn_type,
    debit_credit,
    balance_after,
    channel,
    description,
    counter_account,
    created_ts,
    last_updated
  FROM core_banking.txn_account
