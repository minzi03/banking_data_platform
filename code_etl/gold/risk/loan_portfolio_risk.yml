job:
  type: risk
source:
  tables: [silver.dim_loan, silver.dim_branch, silver.fact_loan_payment]
target:
  catalog: lakehouse
  schema: gold
  table: loan_portfolio_risk
upstream_flags: [silver.dim_loan, silver.dim_branch, silver.fact_loan_payment]
validation:
  require_non_empty: true
  require_snapshots: [silver.fact_loan_payment]
sql: |
  WITH l AS (
    SELECT branch_code, product_code, loan_id, loan_amount, outstanding_balance, loan_status
    FROM lakehouse.silver.dim_loan
  ), agg AS (
    SELECT branch_code, product_code,
      COUNT(DISTINCT loan_id) AS total_loans,
      COUNT(DISTINCT CASE WHEN loan_status='ACTIVE' THEN loan_id END) AS active_loans,
      COUNT(DISTINCT CASE WHEN loan_status='OVERDUE' THEN loan_id END) AS overdue_loans,
      COALESCE(SUM(loan_amount),0) AS total_amount,
      COALESCE(SUM(outstanding_balance),0) AS total_outstanding,
      -- Dư nợ xấu XẤP XỈ: nguồn không có số ngày quá hạn theo khoản vay, nên
      -- không phân được nhóm nợ 3–5 như quy định. Dùng trạng thái thay thế:
      -- OVERDUE (đang quá hạn) + WRITTEN_OFF (đã xoá nợ). Trước đây cột này
      -- bằng đúng total_outstanding — thừa, và đọc như dư nợ xấu thì sai.
      -- Tỷ lệ NPL = npl_proxy / total_outstanding.
      COALESCE(SUM(CASE WHEN loan_status IN ('OVERDUE','WRITTEN_OFF') THEN outstanding_balance END),0) AS npl_outstanding
    FROM l GROUP BY branch_code, product_code
  ), pm AS (
    SELECT l.branch_code, l.product_code,
      COUNT(DISTINCT py.payment_id) AS pmt_count,
      COUNT(DISTINCT CASE WHEN py.payment_status='LATE' THEN py.payment_id END) AS late_count,
      COALESCE(SUM(py.penalty),0) AS total_penalty
    FROM l LEFT JOIN lakehouse.silver.fact_loan_payment py
      ON l.loan_id=py.loan_id AND py.cob_dt=DATE '{{ cob_dt }}'
    GROUP BY l.branch_code, l.product_code
  )
  -- Tiền ép về DECIMAL(18,2) đúng DDL: SUM trên DECIMAL(18,2) ra DECIMAL(28,2), ROUND(x,2)
  -- tăng precision thêm 1. Bảng tạo từ schema kết quả (gold_job khi bảng chưa có) sẽ
  -- lệch DDL — drift DAG đo được 2026-09-29 (DECIMAL(29,2) ở 4 cột bảng này).
  SELECT a.branch_code, COALESCE(b.branch_name,'UNK') AS branch_name,
    a.product_code, a.total_loans, a.active_loans, a.overdue_loans,
    CAST(a.total_amount AS DECIMAL(18,2)) AS total_amount,
    CAST(a.total_outstanding AS DECIMAL(18,2)) AS total_outstanding,
    ROUND(CASE WHEN a.total_loans=0 THEN 0 ELSE CAST(a.overdue_loans AS DOUBLE)/a.total_loans END,4) AS overdue_rate,
    CAST(a.npl_outstanding AS DECIMAL(18,2)) AS npl_proxy,
    COALESCE(pm.pmt_count,0) AS payment_count,
    COALESCE(pm.late_count,0) AS late_payment_count,
    ROUND(CASE WHEN COALESCE(pm.pmt_count,0)=0 THEN 0 ELSE CAST(pm.late_count AS DOUBLE)/pm.pmt_count END,4) AS late_payment_rate,
    CAST(COALESCE(pm.total_penalty,0) AS DECIMAL(18,2)) AS total_penalty,
    DATE '{{ cob_dt }}' AS cob_dt
  FROM agg a
  LEFT JOIN lakehouse.silver.dim_branch b ON a.branch_code=b.branch_code
  LEFT JOIN pm ON a.branch_code=pm.branch_code AND a.product_code=pm.product_code
