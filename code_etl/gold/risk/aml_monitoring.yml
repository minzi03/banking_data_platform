job:
  type: risk
source:
  tables:
    - silver.fact_txn_account
    - silver.dim_customer
    - silver.dim_account
    - silver.fact_online_transaction
    - silver.dim_location
target:
  catalog: lakehouse
  schema: gold
  table: aml_monitoring
upstream_flags:
  - silver.fact_txn_account
  - silver.dim_customer
  - silver.dim_account
  - silver.fact_online_transaction
validation:
  require_non_empty: true
  # fact_online_transaction là ràng buộc CHẶN, không phải tuỳ chọn.
  # geo_velocity_flag suy ra từ nó bằng LEFT JOIN: partition thiếu thì flag
  # ra 0 cho MỌI khách hàng, alert_score tụt, và bảng trông hoàn toàn bình
  # thường — không dòng nào rỗng, không check nào đỏ. Đó đúng là silent
  # corruption mà ADR-0005 mô tả, nên phải chặn trước khi ghi.
  require_snapshots: [silver.fact_txn_account, silver.fact_online_transaction]
sql: |
  WITH txn AS (
    SELECT t.txn_id, t.account_id, t.customer_id, t.txn_date,
      t.txn_amount, t.txn_type, t.debit_credit, t.balance_after,
      t.channel, t.description, t.counter_account,
      c.customer_segment, a.branch_code
    FROM lakehouse.silver.fact_txn_account t
    LEFT JOIN lakehouse.silver.dim_customer c ON t.customer_id=c.customer_id AND c.is_current=1
    LEFT JOIN lakehouse.silver.dim_account a ON t.account_id=a.account_id AND a.is_current=1
    WHERE t.cob_dt = DATE '{{ cob_dt }}'
  ),
  -- Từng có CTE `customer_stats` ở đây, tính total_credit / total_debit / txn_count
  -- theo khách trên toàn partition. Không cột nào của nó ra tới SELECT cuối, và
  -- nó so debit_credit với 'CREDIT'/'DEBIT' trong khi nguồn chỉ có 'D'/'C'
  -- (CHECK ở docker/init_postgres/01_ddl_core_banking.sql) — tức là tính sai một
  -- thứ không ai dùng. Đã gỡ; tests/gold/test_risk_mart_semantics.py chặn cả
  -- literal debit_credit sai lẫn CTE không được tham chiếu.
  daily_agg AS (
    SELECT customer_id,
      CAST(from_utc_timestamp(txn_date, 'Asia/Ho_Chi_Minh') AS DATE) AS txn_day,
      COUNT(txn_id) AS daily_txn_count,
      SUM(txn_amount) AS daily_total_amount,
      COUNT(CASE WHEN txn_amount BETWEEN 50000000 AND 99999999 THEN 1 END) AS structured_count,
      -- channel_count CHUYỂN từ customer_stats sang đây. Ở grain partition nó
      -- đếm kênh trên ~14 tháng: 94,9% khách chạm đủ 5 kênh, nên `>= 4` gắn cờ
      -- 99,9% — vô nghĩa. Ở grain ngày, phân phối thật là:
      --     1 kênh  873.800  87,9%
      --     2 kênh  112.750  11,3%
      --     3 kênh    7.745   0,8%
      --     4 kênh      263   0,03%   ← ngưỡng >= 4 giữ nguyên
      --     5 kênh        2   0,00%
      -- Ngưỡng chưa bao giờ sai; GRAIN mới sai.
      COUNT(DISTINCT channel) AS daily_channel_count
    FROM txn
    GROUP BY customer_id, CAST(from_utc_timestamp(txn_date, 'Asia/Ho_Chi_Minh') AS DATE)
  ),
  -- Geo-velocity: khách hàng giao dịch ở nhiều tỉnh/thành khác nhau trong
  -- cùng một ngày nghiệp vụ. Typology AML chuẩn cho account/card takeover.
  --
  -- Chỉ kênh online mang location_id: fact_txn_account KHÔNG có cột địa lý
  -- nào, nên tín hiệu này bắt buộc phải lấy từ fact_online_transaction.
  -- Grain customer-day, giống velocity_flag, rồi join ngược về transaction.
  geo_agg AS (
    SELECT ot.customer_id,
      CAST(from_utc_timestamp(ot.transaction_date, 'Asia/Ho_Chi_Minh') AS DATE) AS txn_day,
      COUNT(DISTINCT l.state) AS distinct_states,
      COUNT(DISTINCT CASE WHEN l.is_high_risk_area = 1 THEN l.location_id END) AS high_risk_locations
    FROM lakehouse.silver.fact_online_transaction ot
    JOIN lakehouse.silver.dim_location l ON ot.location_id = l.location_id
    WHERE ot.cob_dt = DATE '{{ cob_dt }}'
      AND ot.status = 'SUCCESS'
    GROUP BY ot.customer_id,
      CAST(from_utc_timestamp(ot.transaction_date, 'Asia/Ho_Chi_Minh') AS DATE)
  ),
  flagged AS (
    SELECT t.*,
      da.daily_txn_count, da.daily_total_amount, da.structured_count,
      da.daily_channel_count AS channel_count,
      COALESCE(ga.distinct_states, 0) AS distinct_states,
      COALESCE(ga.high_risk_locations, 0) AS high_risk_locations,
      -- ⚠ high_value_flag CHƯA hiệu chỉnh được, và đây là lý do — ghi ra để
      -- không ai tưởng 200tr là con số đã cân nhắc theo dữ liệu.
      -- Generator sinh txn_amount bằng random.uniform(10.000, 500.000.000),
      -- nên median là 250tr — NẰM TRÊN ngưỡng. Kết quả: gắn cờ 60% giao dịch.
      -- Nâng ngưỡng lên p99 (≈495tr) sẽ cho tỷ lệ đẹp nhưng là con số vô nghĩa
      -- với ngân hàng thật; gốc rễ là phân phối amount không thực tế, không
      -- phải ngưỡng. Sửa đúng chỗ là generator — ROADMAP 3.6 (amount lệch phải
      -- thay vì đều). Giữ 200tr vì nó hợp lý với dữ liệu THẬT.
      CASE WHEN t.txn_amount >= 200000000 THEN 1 ELSE 0 END AS high_value_flag,
      -- >= 3 không bao giờ chạy (0,0%). Ở grain ngày, >= 2 gắn cờ 0,2%.
      CASE WHEN da.structured_count >= 2 THEN 1 ELSE 0 END AS structuring_flag,
      -- >= 10 là BẤT KHẢ THI: số giao dịch/khách/ngày tối đa đo được là 8,
      -- nên rule này chưa từng gắn cờ dòng nào. Phân phối thật:
      --     >= 3 txn  2,7%   ·   >= 4 txn  0,4%   ·   >= 5 txn  0,0%
      CASE WHEN da.daily_txn_count >= 4 THEN 1 ELSE 0 END AS velocity_flag,
      CASE WHEN da.daily_channel_count >= 4 THEN 1 ELSE 0 END AS multi_channel_flag,
      -- Ngưỡng >= 3 ĐO ĐƯỢC, không phải chọn cảm tính. Phân phối số tỉnh/thành
      -- riêng biệt mỗi customer-day trên snapshot 2026-09-20:
      --     1 state  412.786  95,0%
      --     2 states  21.205   4,9%
      --     3 states     673   0,2%   ← ngưỡng ở đây
      --     4 states      15   0,0%
      -- >=2 gắn cờ 5,1% (quá ồn), >=4 chỉ 15 ca (quá hiếm để hữu dụng).
      -- Kiểm chứng trên nhãn is_fraud của cùng snapshot: nhóm gắn cờ có tỷ lệ
      -- fraud 2,0% so với 0,8% ở nhóm không gắn cờ — lift 2,5×.
      CASE WHEN COALESCE(ga.distinct_states, 0) >= 3 THEN 1 ELSE 0 END AS geo_velocity_flag
    FROM txn t
    LEFT JOIN daily_agg da
      ON t.customer_id = da.customer_id
      AND CAST(from_utc_timestamp(t.txn_date, 'Asia/Ho_Chi_Minh') AS DATE) = da.txn_day
    LEFT JOIN geo_agg ga
      ON t.customer_id = ga.customer_id
      AND CAST(from_utc_timestamp(t.txn_date, 'Asia/Ho_Chi_Minh') AS DATE) = ga.txn_day
  ),
  -- Ground truth fraud flag từ fact_online_transaction, aggregate customer-day.
  -- fact_txn_account KHÔNG có is_fraud; tín hiệu chỉ có ở kênh online.
  -- is_fraud_flag = 1 nghĩa là KHÁCH HÀNG này có ÍT NHẤT MỘT giao dịch online
  -- fraud trong ngày đó. Dùng làm ground truth cho rule-based flags, KHÔNG làm feature.
  fraud_agg AS (
    SELECT
      customer_id,
      CAST(from_utc_timestamp(transaction_date, 'Asia/Ho_Chi_Minh') AS DATE) AS txn_day,
      MAX(is_fraud) AS is_fraud_flag,
      MAX(CASE WHEN is_fraud = 1 THEN fraud_reason ELSE NULL END) AS fraud_reason
    FROM lakehouse.silver.fact_online_transaction
    WHERE cob_dt = DATE '{{ cob_dt }}'
      AND status = 'SUCCESS'
    GROUP BY customer_id,
      CAST(from_utc_timestamp(transaction_date, 'Asia/Ho_Chi_Minh') AS DATE)
  )
  -- customer_id PHẢI ghi rõ `flagged.`: fraud_agg cũng có cột này, và bản đầu
  -- để trần nên Spark từ chối ngay lúc phân tích (AMBIGUOUS_REFERENCE) — job
  -- chưa từng chạy được mà không test tĩnh nào thấy.
  SELECT txn_id, account_id, flagged.customer_id, customer_segment, branch_code,
    txn_amount, txn_type, debit_credit, channel, description, counter_account, txn_date,
    distinct_states, high_risk_locations,
    high_value_flag, structuring_flag, velocity_flag, multi_channel_flag, geo_velocity_flag,
    -- Trọng số geo_velocity = 3, ngang high_value.
    -- structuring giữ 4 vì nó là hành vi CỐ Ý né ngưỡng báo cáo, không phải
    -- bất thường ngẫu nhiên. geo_velocity xếp dưới nó nhưng trên velocity(2)
    -- và multi_channel(1) vì di chuyển địa lý bất khả thi là chỉ báo mạnh của
    -- account takeover, và đo được lift 2,5× trên nhãn fraud.
    (high_value_flag*3 + structuring_flag*4 + velocity_flag*2
     + multi_channel_flag*1 + geo_velocity_flag*3) AS alert_score,
    CASE WHEN (high_value_flag+structuring_flag+velocity_flag+multi_channel_flag+geo_velocity_flag)>=3 THEN 3
      WHEN (high_value_flag+structuring_flag+velocity_flag+multi_channel_flag+geo_velocity_flag)>=2 THEN 2
      WHEN (high_value_flag+structuring_flag+velocity_flag+multi_channel_flag+geo_velocity_flag)>=1 THEN 1
      ELSE 0 END AS risk_level,
    CASE WHEN (high_value_flag+structuring_flag+velocity_flag+multi_channel_flag+geo_velocity_flag)>=2 THEN 1 ELSE 0 END AS alert_generated,
    COALESCE(fa.is_fraud_flag, 0) AS is_fraud,
    fa.fraud_reason,
    DATE '{{ cob_dt }}' AS cob_dt
  FROM flagged
  LEFT JOIN fraud_agg fa
    ON flagged.customer_id = fa.customer_id
    AND CAST(from_utc_timestamp(flagged.txn_date, 'Asia/Ho_Chi_Minh') AS DATE) = fa.txn_day
