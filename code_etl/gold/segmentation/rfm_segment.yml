# Gold: rfm_segment — RFM scoring & 7-segment classification
# Note:
#   - This table is a daily snapshot partitioned by cob_dt.
#   - Use lakehouse.gold.rfm_segment_current for current-only serving (1 row/customer).
#
# Temporal semantics — hai loại thời gian, không được lẫn:
#   cob_dt   = physical snapshot của fact table (processing date).
#              Silver fact là full snapshot mỗi cob_dt, nên PHẢI chốt đúng 1 partition,
#              nếu không mọi aggregate sẽ bị cộng chồng qua các ngày.
#   txn_date = business event date, định nghĩa cửa sổ nghiệp vụ 90 ngày.
#
# Grain rule:
#   Mỗi fact phải tự aggregate về grain customer_id TRONG CTE RIÊNG rồi mới join.
#   Tuyệt đối không join 2 raw fact trong cùng một aggregation grain — sẽ tạo
#   Cartesian fan-out và nhân SUM() lên theo số dòng của fact còn lại.
#
# ─── Business-date semantics (timezone migration) ────────────────────────────
# storage/instant = UTC   |   business timezone = Asia/Ho_Chi_Minh
#
# Timestamp KHÔNG được convert sang ICT; nó vẫn là instant UTC. Chỉ khi cần
# NGÀY/THÁNG nghiệp vụ mới derive tường minh:
#     CAST(from_utc_timestamp(<ts>, 'Asia/Ho_Chi_Minh') AS DATE)
#
# `CAST(<ts> AS DATE)` trần bucket theo session timezone của engine — Spark và
# Trino từng lệch 29,2% số dòng vì việc đó. Biểu thức trên chỉ đúng dưới
# session=UTC, và điều kiện đó được enforce bởi assert_utc_session().
#
# cob_dt KHÔNG đổi nghĩa: nó là orchestration/snapshot date, không phải hàm
# của event timestamp.
job:
  type: segment

source:
  tables:
    - silver.dim_customer
    - silver.fact_txn_account
    - silver.fact_card_txn

target:
  catalog: lakehouse
  schema: gold
  table: rfm_segment

upstream_flags:
  - silver.dim_customer
  - silver.fact_txn_account
  - silver.fact_card_txn

validation:
  # Chặn ghi Gold khi query không sinh dòng nào.
  require_non_empty: true
  # Snapshot-backed source: phải tồn tại partition cob_dt đang xử lý.
  # Thiếu partition mà vẫn chạy sẽ ghi Gold sai: model neo dim_customer (LEFT JOIN)
  # cho ra đủ số dòng nhưng metric toàn 0; model neo fact cho ra rỗng. Cả hai đều
  # là silent corruption nên phải fail trước khi transform.
  require_snapshots:
    - silver.fact_txn_account
    - silver.fact_card_txn

sql: |
  WITH customers AS (
      SELECT
          customer_id,
          customer_sk
      FROM lakehouse.silver.dim_customer
      WHERE is_current = 1
  ),
  -- Account transactions — aggregate về grain customer_id trước khi join
  acct_txn AS (
      SELECT
          customer_id,
          COUNT(DISTINCT txn_id) AS acct_txn_count,
          COALESCE(SUM(ABS(txn_amount)), 0) AS acct_txn_amount,
          MAX(txn_date) AS acct_last_txn_date
      FROM lakehouse.silver.fact_txn_account
      WHERE cob_dt = DATE '{{ cob_dt }}'
        AND CAST(from_utc_timestamp(txn_date, 'Asia/Ho_Chi_Minh') AS DATE) >= DATE_ADD(DATE '{{ cob_dt }}', -90)
        AND CAST(from_utc_timestamp(txn_date, 'Asia/Ho_Chi_Minh') AS DATE) <= DATE '{{ cob_dt }}'
      GROUP BY customer_id
  ),
  -- Card transactions — aggregate về grain customer_id trước khi join
  card_txn AS (
      SELECT
          customer_id,
          COUNT(DISTINCT txn_id) AS card_txn_count,
          COALESCE(SUM(CASE WHEN txn_type NOT IN ('REFUND','REVERSAL') THEN txn_amount ELSE 0 END), 0) AS card_txn_amount,
          MAX(txn_date) AS card_last_txn_date
      FROM lakehouse.silver.fact_card_txn
      WHERE cob_dt = DATE '{{ cob_dt }}'
        AND status = 'SUCCESS'
        AND CAST(from_utc_timestamp(txn_date, 'Asia/Ho_Chi_Minh') AS DATE) >= DATE_ADD(DATE '{{ cob_dt }}', -90)
        AND CAST(from_utc_timestamp(txn_date, 'Asia/Ho_Chi_Minh') AS DATE) <= DATE '{{ cob_dt }}'
      GROUP BY customer_id
  ),
  rfm_base AS (
      SELECT
          c.customer_id,
          c.customer_sk,
          -- Sentinel 1900-01-01 giữ nguyên semantics cũ: khách không có giao dịch
          -- nào trong cửa sổ vẫn ra recency rất lớn thay vì NULL.
          -- COALESCE trước GREATEST để khách chỉ có 1 kênh vẫn lấy đúng ngày.
          DATEDIFF(
              DATE '{{ cob_dt }}',
              CAST(GREATEST(
                  COALESCE(a.acct_last_txn_date, TIMESTAMP '1900-01-01 00:00:00'),
                  COALESCE(k.card_last_txn_date, TIMESTAMP '1900-01-01 00:00:00')
              ) AS DATE)
          ) AS recency_days,
          COALESCE(a.acct_txn_count, 0) + COALESCE(k.card_txn_count, 0) AS frequency,
          COALESCE(a.acct_txn_amount, 0) + COALESCE(k.card_txn_amount, 0) AS monetary
      FROM customers c
      LEFT JOIN acct_txn a ON c.customer_id = a.customer_id
      LEFT JOIN card_txn k ON c.customer_id = k.customer_id
  ),
  rfm_scored AS (
      SELECT *,
          NTILE(5) OVER (ORDER BY recency_days ASC) AS r_score,
          NTILE(5) OVER (ORDER BY frequency DESC) AS f_score,
          NTILE(5) OVER (ORDER BY monetary DESC) AS m_score
      FROM rfm_base
  )
  SELECT
      customer_id, customer_sk, recency_days, frequency, ROUND(monetary, 2) AS monetary,
      r_score, f_score, m_score,
      (r_score + f_score + m_score) AS rfm_score,
      CASE
          WHEN (r_score + f_score + m_score) >= 13 THEN 'Champions'
          WHEN (r_score + f_score + m_score) >= 10 THEN 'Loyal Customers'
          WHEN (r_score + f_score + m_score) >= 7 THEN 'Potential Loyalists'
          WHEN (r_score + f_score + m_score) >= 6 THEN 'New Customers'
          WHEN (r_score + f_score + m_score) >= 4 THEN 'At Risk'
          WHEN (r_score + f_score + m_score) >= 2 THEN 'Hibernating'
          ELSE 'Lost'
      END AS rfm_segment,
      DATE '{{ cob_dt }}' AS cob_dt
  FROM rfm_scored
