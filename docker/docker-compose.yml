# =============================================================================
# Banking Data Platform — Docker Compose Stack
# =============================================================================
#
# ARCHITECTURE DEPENDENCY:
#
#   postgres ─────────────────────────────────────────────────────────────┐
#       │                                                                │
#   minio → mc → iceberg-rest                                           │
#                    │                                                   │
#               spark-master ────────────────────────────────── airflow-init
#                    │                                                   │
#              spark-worker-1                           airflow-webserver
#                                                       airflow-scheduler
#   zookeeper → kafka → debezium                                        │
#                    │                                                   │
#   trino ───────────────────────────────────────────────────────────────┘
#   (trino reads from iceberg-rest catalog)
#
#   om-mysql → om-elasticsearch → openmetadata (Data Catalog & Lineage)
#
# =============================================================================
# QUICK START:
#
#   [1] Start everything:
#       docker compose up -d
#
#   [2] Start without CDC (lighter):
#       docker compose up -d --scale debezium=0
#
#   [3] Start without Airflow:
#       docker compose up -d --scale airflow-webserver=0 --scale airflow-scheduler=0
#
#   [4] Start without OpenMetadata (lighter):
#       docker compose up -d --scale openmetadata=0 --scale om-mysql=0 --scale om-elasticsearch=0
#
# RESOURCE BUDGET (Docker Desktop ~14GB):
#
#   postgres          400m  │ dev scale
#   minio             384m  │ object storage
#   iceberg-rest      384m  │ REST adapter
#   spark-master      400m  │ coordinate only
#   spark-worker-1   9000m  │ 8 cores, 8GB for 6 streaming jobs
#   zookeeper         256m  │ lightweight
#   kafka            1024m  │ single broker
#   debezium         2048m  │ CDC connector (snapshot memory)
#   trino            1200m  │ heap 768m + code-cache 128m + JVM overhead
#   airflow-web       800m  │ web UI
#   airflow-sched    1300m  │ scheduler
#   om-mysql          500m  │ OpenMetadata backend
#   om-elasticsearch 1024m  │ OpenMetadata search
#   openmetadata     1500m  │ Data Catalog & Lineage
#   ─────────────────────────────────────────────────────────────────────
#   TOTAL          ~18072m  │ headroom ~2GB for kernel + file cache
# =============================================================================

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: banking-airflow:2.10.0
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__CORE__DEFAULT_TIMEZONE: "Asia/Ho_Chi_Minh"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
    AIRFLOW__CORE__PLUGINS_FOLDER: /opt/project/airflow/plugins
    TZ: "Asia/Ho_Chi_Minh"
    AIRFLOW__LOGGING__REMOTE_LOGGING: "true"
    AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: "s3://${MINIO_BUCKET}/airflow-logs"
    AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: "aws_s3_minio"
    AIRFLOW__LOGGING__DELETE_LOCAL_LOGS: "true"
    AIRFLOW__CORE__LOG_RETENTION_DAYS: "3"
    AIRFLOW__WEBSERVER__WORKERS: "1"
    AIRFLOW_CONN_AWS_S3_MINIO: >-
      {"conn_type": "aws", "extra": {"endpoint_url": "http://minio:9000", "region_name": "us-east-1"}}
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    AWS_REGION: us-east-1
    SPARK_EXTRA_CLASSPATH: "/opt/spark-jars/*"
  volumes:
    - ..:/opt/project
    - airflow-logs:/opt/airflow/logs
    - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    - /var/run/docker.sock:/var/run/docker.sock
  networks:
    - lakehouse_net
  depends_on:
    postgres:
      condition: service_healthy

# =============================================================================
services:

  # ===========================================================================
  # SOURCE DATABASE
  # ===========================================================================

  postgres:
    image: postgres:15-alpine
    container_name: banking-postgres
    hostname: postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGTZ: "Asia/Ho_Chi_Minh"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init_postgres:/docker-entrypoint-initdb.d
    mem_limit: 400m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lakehouse_net

  # ===========================================================================
  # OBJECT STORAGE LAYER
  # ===========================================================================

  minio:
    image: minio/minio:latest
    container_name: banking-minio
    hostname: minio
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lakehouse_net

  # MinIO Client — create bucket on startup
  mc:
    image: minio/mc:latest
    container_name: banking-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/${MINIO_BUCKET};
        mc mb --ignore-existing local/${MINIO_BUCKET}/airflow-logs;
        mc mb --ignore-existing local/${MINIO_BUCKET}/spark-logs;
        echo 'MinIO buckets created successfully';
      "
    env_file: .env
    networks:
      - lakehouse_net

  # ===========================================================================
  # ICEBERG REST CATALOG
  # ===========================================================================

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: banking-iceberg-rest
    hostname: iceberg-rest
    env_file: .env
    environment:
      CATALOG_WAREHOUSE: s3a://${MINIO_BUCKET}/lakehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres:5432/${ICEBERG_DB}
      CATALOG_JDBC_USER: ${POSTGRES_USER}
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
      CATALOG_JDBC_INITIALIZE__TABLES: "true"
    ports:
      - "8181:8181"
    mem_limit: 384m
    depends_on:
      minio:
        condition: service_healthy
      mc:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/localhost/8181 && echo -e 'GET /v1/config HTTP/1.0\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s
    networks:
      - lakehouse_net

  # ===========================================================================
  # SPARK CLUSTER (Standalone — 1 Master + 1 Worker)
  # ===========================================================================

  spark-master:
    image: apache/spark:3.5.3
    container_name: banking-spark-master
    hostname: spark-master
    user: root
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 9090
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ..:/opt/project
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    ports:
      - "7077:7077"
      - "9090:9090"
      - "10000:10000"
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lakehouse_net

  spark-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: banking-spark-worker-1
    hostname: spark-worker-1
    user: root
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 9091
    environment:
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "9091:9091"
    volumes:
      - ..:/opt/project
      - spark-data:/opt/spark/data
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    mem_limit: 9000m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9091 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - lakehouse_net

  # ===========================================================================
  # ICEBERG INIT (runs DDL scripts once on first startup)
  # ===========================================================================

  iceberg-init:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: banking-iceberg-init
    user: root
    command: /bin/bash /opt/project/docker/init_iceberg/init_all.sh
    environment:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ..:/opt/project
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    mem_limit: 2g
    depends_on:
      iceberg-rest:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      spark-worker-1:
        condition: service_healthy
    networks:
      - lakehouse_net
    restart: "no"

  # ===========================================================================
  # CDC LAYER (Debezium + Kafka + Zookeeper)
  # ===========================================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: banking-zookeeper
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q 'Zookeeper version'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lakehouse_net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: banking-kafka
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - lakehouse_net

  debezium:
    image: debezium/connect:2.6
    container_name: banking-debezium
    hostname: debezium
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      BOOTSTRAP_SERVERS: kafka:9092
    mem_limit: 2048m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - lakehouse_net

  # ===========================================================================
  # KAFKA UI (Monitoring)
  # ===========================================================================

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: banking-kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: banking
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_METRICS_PORT: 9997
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 512m
    networks:
      - lakehouse_net

  # ===========================================================================
  # QUERY LAYER
  # ===========================================================================

  trino:
    image: trinodb/trino:443
    container_name: banking-trino
    hostname: trino
    ports:
      - "8085:8080"
    volumes:
      - ./init_trino/catalog:/etc/trino/catalog:ro
    mem_limit: 6000m
    environment:
      TZ: "Asia/Ho_Chi_Minh"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      iceberg-rest:
        condition: service_healthy
    networks:
      - lakehouse_net

  # ===========================================================================
  # ORCHESTRATION LAYER (Airflow)
  # ===========================================================================

  airflow-init:
    <<: *airflow-common
    container_name: banking-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username $${AIRFLOW_ADMIN_USER} \
          --password $${AIRFLOW_ADMIN_PASSWORD} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email $${AIRFLOW_ADMIN_EMAIL}
        # Create Airflow connections for JDBC
        airflow connections add 'postgres-banking' \
          --conn-type 'postgres' \
          --conn-host 'postgres' \
          --conn-port '5432' \
          --conn-schema "${POSTGRES_DB}" \
          --conn-login "${POSTGRES_USER}" \
          --conn-password "${POSTGRES_PASSWORD}"
        echo "Airflow initialization complete"
    environment:
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
    mem_limit: 800m
    depends_on:
      postgres:
        condition: service_healthy
      spark-worker-1:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    container_name: banking-airflow-webserver
    command: airflow webserver --port 8080
    ports:
      - "8080:8080"
    mem_limit: 800m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - lakehouse_net

  airflow-scheduler:
    <<: *airflow-common
    container_name: banking-airflow-scheduler
    command: airflow scheduler
    mem_limit: 1300m
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME} || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - lakehouse_net

# =============================================================================
# CATALOG & LINEAGE LAYER (OpenMetadata)
# =============================================================================

  om-mysql:
    image: mysql:8.0
    container_name: banking-om-mysql
    hostname: om-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${OM_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${OM_DB_NAME}
      MYSQL_USER: ${OM_DB_USER}
      MYSQL_PASSWORD: ${OM_DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - om-mysql-data:/var/lib/mysql
    mem_limit: 500m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lakehouse_net

  om-elasticsearch:
    image: elasticsearch:8.12.0
    container_name: banking-om-elasticsearch
    hostname: om-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - om-es-data:/usr/share/elasticsearch/data
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - lakehouse_net

  om-migrate:
    image: openmetadata/server:1.5.6
    container_name: banking-om-migrate
    hostname: om-migrate
    env_file: .env
    command: "./bootstrap/openmetadata-ops.sh migrate"
    environment:
      SERVER_PORT: "8585"
      SERVER_ADMIN_PORT: "8586"
      DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
      DB_SCHEME: mysql
      DB_PARAMS: "allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      DB_HOST: om-mysql
      DB_PORT: "3306"
      DB_USER: ${OM_DB_USER}
      DB_USER_PASSWORD: ${OM_DB_PASSWORD}
      OM_DATABASE: ${OM_DB_NAME}
      ELASTICSEARCH_HOST: om-elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: http
      SEARCH_TYPE: elasticsearch
      AUTHENTICATION_PROVIDER: basic
      RSA_PUBLIC_KEY_FILE_PATH: ./conf/public_key.der
      RSA_PRIVATE_KEY_FILE_PATH: ./conf/private_key.der
      JWT_ISSUER: open-metadata.org
    depends_on:
      om-mysql:
        condition: service_healthy
      om-elasticsearch:
        condition: service_healthy
    mem_limit: 2048m
    networks:
      - lakehouse_net

  openmetadata:
    image: openmetadata/server:1.5.6
    container_name: banking-openmetadata
    hostname: openmetadata
    env_file: .env
    environment:
      SERVER_PORT: "8585"
      SERVER_ADMIN_PORT: "8586"
      DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
      DB_SCHEME: mysql
      DB_PARAMS: "allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      DB_HOST: om-mysql
      DB_PORT: "3306"
      DB_USER: ${OM_DB_USER}
      DB_USER_PASSWORD: ${OM_DB_PASSWORD}
      OM_DATABASE: ${OM_DB_NAME}
      ELASTICSEARCH_HOST: om-elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: http
      SEARCH_TYPE: elasticsearch
      AUTHENTICATION_PROVIDER: basic
      AUTHENTICATION_ENABLE_SELF_SIGNUP: "true"
      RSA_PUBLIC_KEY_FILE_PATH: ./conf/public_key.der
      RSA_PRIVATE_KEY_FILE_PATH: ./conf/private_key.der
      JWT_ISSUER: open-metadata.org
    ports:
      - "8585:8585"
    mem_limit: 1500m
    depends_on:
      om-mysql:
        condition: service_healthy
      om-elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8585/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - lakehouse_net

# =============================================================================
# VISUALIZATION LAYER (Streamlit)
# =============================================================================

  streamlit:
    build:
      context: ../streamlit
      dockerfile: Dockerfile
    container_name: banking-streamlit
    hostname: streamlit
    ports:
      - "8501:8501"
    volumes:
      - ../streamlit:/app
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - lakehouse_net

  # ── dbt (Semantic Layer) ──────────────────────────────────────────────────
  dbt:
    build:
      context: ../dbt
      dockerfile: Dockerfile
    container_name: banking-dbt
    hostname: dbt
    volumes:
      - ../dbt:/usr/src/dbt
    working_dir: /usr/src/dbt
    environment:
      - DBT_HOST=trino
      - DBT_PORT=8085
      - DBT_CATALOG=lakehouse
      - DBT_SCHEMA=semantic
      - DBT_USER=admin
    mem_limit: 1g
    networks:
      - lakehouse_net
    profiles:
      - tools

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres-data:
  minio-data:
  spark-data:
  airflow-logs:
  om-mysql-data:
  om-es-data:

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  lakehouse_net:
    driver: bridge
