# Trino Lakehouse Catalog — Iceberg via REST (Security Enhanced)
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3a://lakehouse/lakehouse
iceberg.file-format=PARQUET

# S3 access via native filesystem
hive.s3.endpoint=http://minio:9000
hive.s3.path-style-access=true
hive.s3.aws-access-key=minioadmin
hive.s3.aws-secret-key=Minioadmin123
hive.s3.region=us-east-1

# Security: Hide system schemas from non-admin users
iceberg.security.managed=true
