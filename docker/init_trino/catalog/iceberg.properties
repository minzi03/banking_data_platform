# Trino Iceberg Catalog — Iceberg via REST
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3a://lakehouse/lakehouse
iceberg.file-format=PARQUET

# S3 access via native filesystem. Credential lấy từ env của container trino
# (compose đặt từ docker/.env) — file này được commit, không chứa secret.
hive.s3.endpoint=http://minio:9000
hive.s3.path-style-access=true
hive.s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
hive.s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
hive.s3.region=us-east-1
