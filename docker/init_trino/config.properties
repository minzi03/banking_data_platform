# Trino server — single node. Xác thực mật khẩu qua HTTPS (ADR-0016).
#
# Không có secret nào trong file này: mật khẩu keystore và shared secret đọc
# từ biến môi trường (${ENV:…}), keystore và password file mount chỉ-đọc từ
# docker/secrets/trino/ — sinh bởi scripts/bootstrap_trino_auth.py, gitignore.
#
# Đo trên Trino 443 trước khi chọn cấu hình này:
#   HTTP 8080 → 403 cho mọi truy vấn client, kể cả khi gửi kèm mật khẩu;
#   HTTPS 8443 → 401 khi thiếu/sai mật khẩu, 200 khi đúng.
# HTTP 8080 vẫn phục vụ giao tiếp nội bộ (ký bằng shared secret) và
# /v1/info cho healthcheck.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}

http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/secrets/keystore.p12
http-server.https.keystore.key=${ENV:TRINO_KEYSTORE_PASSWORD}

http-server.authentication.type=PASSWORD
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
