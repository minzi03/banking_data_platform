# Mặc định của Trino CLI BÊN TRONG container Trino — mount thành ~/.trino_config.
#
# Nhờ file này mọi lệnh `docker exec <trino> trino --execute …` sẵn có (CI,
# integration test, RUNBOOK, scripts) chạy nguyên văn: CLI tự nói HTTPS với
# localhost và lấy mật khẩu của user `trino` từ $TRINO_PASSWORD của container.
# `--user X` vẫn đổi được user, nhưng phải kèm mật khẩu của X
# (`docker exec -e TRINO_PASSWORD=… … --user X`); không có thì bị từ chối.
# `insecure`: cert tự ký, và CLI chỉ nói với localhost trong chính container.
server=https://localhost:8443
user=trino
password=true
insecure=true
