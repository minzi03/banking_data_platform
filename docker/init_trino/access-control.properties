# Trino Access Control Configuration — File-Based RBAC
# Documentation: https://trino.io/docs/current/security/file-system-access-control.html

# =============================================================================
# ROLES
# =============================================================================
# admin       — Full access to all catalogs, schemas, tables
# etl_user    — Read/Write access to bronze, silver, gold schemas
# analytics   — Read-only access to gold, silver schemas
# readonly    — Read-only access to gold schema only

# =============================================================================
# CATALOG RULES
# =============================================================================

# Admin: full access to all catalogs
catalog=iceberg
group=admins
catalog-allow=true

# ETL user: full access to lakehouse catalog
catalog=iceberg
group=etl_users
catalog-allow=true

# Analytics: read-only access to lakehouse catalog
catalog=iceberg
group=analysts
catalog-allow=true

# Readonly: read-only access to lakehouse catalog
catalog=iceberg
group=readonly_users
catalog-allow=true

# =============================================================================
# SCHEMA RULES
# =============================================================================

# Admin: full access to all schemas
schema=iceberg:.*
group=admins
schema-allow=true

# ETL user: full access to bronze, silver, gold, sandbox
schema=iceberg:bronze
group=etl_users
schema-allow=true

schema=iceberg:silver
group=etl_users
schema-allow=true

schema=iceberg:gold
group=etl_users
schema-allow=true

schema=iceberg:sandbox
group=etl_users
schema-allow=true

# Analytics: read-only access to gold, silver, sandbox
schema=iceberg:gold
group=analysts
schema-allow=true
schema-allow-write=false

schema=iceberg:silver
group=analysts
schema-allow=true
schema-allow-write=false

schema=iceberg:sandbox
group=analysts
schema-allow=true
schema-allow-write=false

# Bronze: no access for analytics (raw data contains PII)
schema=iceberg:bronze
group=analysts
schema-allow=false

# Readonly: read-only access to gold only
schema=iceberg:gold
group=readonly_users
schema-allow=true
schema-allow-write=false

# Silver/Bronze: no access for readonly
schema=iceberg:silver
group=readonly_users
schema-allow=false

schema=iceberg:bronze
group=readonly_users
schema-allow=false

# =============================================================================
# TABLE RULES
# =============================================================================

# Admin: full access to all tables
table=iceberg:.*:.*
group=admins
table-allow=true

# ETL user: full access to all tables
table=iceberg:.*:.*
group=etl_users
table-allow=true

# Analytics: read-only access to all tables in gold/silver
table=iceberg:gold:.*
group=analysts
table-allow=true
table-allow-write=false

table=iceberg:silver:.*
group=analysts
table-allow=true
table-allow-write=false

table=iceberg:sandbox:.*
group=analysts
table-allow=true
table-allow-write=false

# Readonly: read-only access to gold tables
table=iceberg:gold:.*
group=readonly_users
table-allow=true
table-allow-write=false

# =============================================================================
# COLUMN-LEVEL SECURITY (PII Masking)
# =============================================================================

# For analysts: mask PII columns in gold tables
# These columns will return masked values for non-admin users

# Mask full_name in mart_customer_360
column=iceberg:gold:mart_customer_360:full_name
group=analysts
mask=concat(substr(%s, 1, 1), '**')

# Mask phone in mart_customer_360
column=iceberg:gold:mart_customer_360:phone
group=analysts
mask=concat(substr(%s, 1, 3), '****', substr(%s, 8))

# Mask email in mart_customer_360
column=iceberg:gold:mart_customer_360:email
group=analysts
mask=concat(substr(%s, 1, 1), '*****', '@', split_part(%s, '@', 2))

# Mask cccd (national ID) - show only last 4 digits
column=iceberg:gold:mart_customer_360:cccd
group=analysts
mask=concat('***********', substr(%s, -4))

# Mask address in mart_customer_360
column=iceberg:gold:mart_customer_360:address
group=analysts
mask='[REDACTED]'

# Similar masking for dim_customer (if accessible)
column=iceberg:silver:dim_customer:full_name
group=analysts
mask=concat(substr(%s, 1, 1), '**')

column=iceberg:silver:dim_customer:phone
group=analysts
mask=concat(substr(%s, 1, 3), '****', substr(%s, 8))

column=iceberg:silver:dim_customer:email
group=analysts
mask=concat(substr(%s, 1, 1), '*****', '@', split_part(%s, '@', 2))

column=iceberg:silver:dim_customer:cccd
group=analysts
mask=concat('***********', substr(%s, -4))

# =============================================================================
# SESSION PROPERTY RULES
# =============================================================================

# ETL users can set session properties
session-property=iceberg:*
group=etl_users
session-property-allow=true

# Admin can set all session properties
session-property=iceberg:*
group=admins
session-property-allow=true
