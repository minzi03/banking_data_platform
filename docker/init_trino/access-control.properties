# Trino system access control — file-based
# https://trino.io/docs/443/security/file-system-access-control.html
#
# Mount vào /etc/trino/access-control.properties (docker-compose.yml,
# docker-compose.ci.yml, terraform/services.tf). Trino chỉ đọc đúng đường dẫn
# đó; đặt ở chỗ khác thì Trino dùng access control `default` — cho phép tất cả.
#
# Luật nằm ở rules.json, SINH RA từ governance/rbac.py:
#   py -3 scripts/generate_trino_access_control.py
# Đừng sửa tay rules.json — test governance chặn drift.
#
# Chưa có xác thực: Trino tin tên user client tự khai. Xem RUNBOOK.md.

access-control.name=file
security.config-file=/etc/trino/rules.json
# Đọc lại rules.json mỗi phút, đổi luật không cần restart Trino.
security.refresh-period=60s
