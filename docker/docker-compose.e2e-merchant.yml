# Isolated TD-22 Merchant EOD verification stack.
# Never use the shared project name/volumes/topics for this file.
services:
  postgres:
    image: postgres:15-alpine
    container_name: merchant-e2e-postgres
    hostname: postgres
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_USER: merchant_e2e
      POSTGRES_PASSWORD: merchant_e2e_only
      POSTGRES_DB: merchant_e2e
    volumes:
      - merchant_e2e_postgres:/var/lib/postgresql/data
      - ./init_merchant_e2e:/docker-entrypoint-initdb.d:ro
      - merchant_e2e_postgres_conf:/etc/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merchant_e2e -d merchant_e2e"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [merchant_e2e_net]

  minio:
    image: ghcr.io/minzi03/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: merchant-e2e-minio
    hostname: minio
    environment:
      MINIO_ROOT_USER: merchant_e2e
      MINIO_ROOT_PASSWORD: merchant_e2e_only_secret
    command: server /data --console-address ":9001"
    volumes:
      - merchant_e2e_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [merchant_e2e_net]

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: merchant-e2e-iceberg-rest
    hostname: iceberg-rest
    environment:
      CATALOG_WAREHOUSE: s3a://merchant-e2e/lakehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: merchant_e2e
      AWS_SECRET_ACCESS_KEY: merchant_e2e_only_secret
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres:5432/iceberg_catalog
      CATALOG_JDBC_USER: merchant_e2e
      CATALOG_JDBC_PASSWORD: merchant_e2e_only
      CATALOG_JDBC_INITIALIZE__TABLES: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [merchant_e2e_net]

  mc:
    image: ghcr.io/minzi03/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: merchant-e2e-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 merchant_e2e merchant_e2e_only_secret && mc mb --ignore-existing local/merchant-e2e"]
    networks: [merchant_e2e_net]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: merchant-e2e-zookeeper
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xms64m -Xmx128m"
    volumes:
      - merchant_e2e_zookeeper_data:/var/lib/zookeeper/data
      - merchant_e2e_zookeeper_log:/var/lib/zookeeper/log
    networks: [merchant_e2e_net]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: merchant-e2e-kafka
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx512m"
    volumes:
      - merchant_e2e_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [merchant_e2e_net]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: merchant-e2e-schema-registry
    hostname: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: merchant-e2e-schemas
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    ports:
      # Chỉ publish ra loopback: registry là isolated nhưng script verify trên
      # host cần tới nó. Không dùng 8081 trên shared stack để tránh trùng cổng.
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [merchant_e2e_net]

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: merchant-e2e-spark-master
    hostname: spark-master
    user: root
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 9090
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      AWS_ACCESS_KEY_ID: merchant_e2e
      AWS_SECRET_ACCESS_KEY: merchant_e2e_only_secret
      AWS_REGION: us-east-1
    volumes:
      - ..:/opt/project
      - ./spark/conf/spark-defaults.e2e-merchant.conf:/opt/spark/conf/spark-defaults.conf:ro
    networks: [merchant_e2e_net]

  spark-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: merchant-e2e-spark-worker
    hostname: spark-worker-1
    user: root
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --webui-port 9091
    environment:
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2
      AWS_ACCESS_KEY_ID: merchant_e2e
      AWS_SECRET_ACCESS_KEY: merchant_e2e_only_secret
      AWS_REGION: us-east-1
    volumes:
      - ..:/opt/project
      - ./spark/conf/spark-defaults.e2e-merchant.conf:/opt/spark/conf/spark-defaults.conf:ro
    depends_on:
      spark-master:
        condition: service_started
    networks: [merchant_e2e_net]

  debezium:
    image: debezium/connect:2.6
    container_name: merchant-e2e-debezium
    hostname: debezium
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      GROUP_ID: merchant-e2e
      CONFIG_STORAGE_TOPIC: merchant-e2e-connect-configs
      OFFSET_STORAGE_TOPIC: merchant-e2e-connect-offsets
      STATUS_STORAGE_TOPIC: merchant-e2e-connect-status
      BOOTSTRAP_SERVERS: kafka:9092
      HEAP_OPTS: "-Xms128m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [merchant_e2e_net]

volumes:
  merchant_e2e_postgres:
  merchant_e2e_minio:
  merchant_e2e_postgres_conf:
  merchant_e2e_zookeeper_data:
  merchant_e2e_zookeeper_log:
  merchant_e2e_kafka_data:

networks:
  merchant_e2e_net:
    name: merchant_e2e_net
