# =============================================================================
# Spark Defaults — Banking Data Platform (Performance Optimized)
# =============================================================================
# Worker: 8 cores, 8GB RAM
# Strategy: Optimized for batch ETL with adaptive query execution
# =============================================================================

# -- Event Logging -----------------------------------------------------------
spark.eventLog.enabled                          false

# -- Iceberg Extensions ------------------------------------------------------
spark.sql.extensions                            org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lakehouse                     org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type                rest
spark.sql.catalog.lakehouse.uri                 http://iceberg-rest:8181
spark.sql.catalog.lakehouse.warehouse           s3a://lakehouse/lakehouse
spark.sql.catalog.lakehouse.io-impl             org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.endpoint         http://minio:9000
spark.sql.catalog.lakehouse.s3.path-style-access true
spark.sql.catalog.lakehouse.s3.access-key-id    minioadmin
spark.sql.catalog.lakehouse.s3.secret-access-key Minioadmin123
spark.sql.defaultCatalog                        lakehouse

# -- S3A / MinIO -------------------------------------------------------------
spark.hadoop.fs.s3a.endpoint                    http://minio:9000
spark.hadoop.fs.s3a.access.key                 minioadmin
spark.hadoop.fs.s3a.secret.key                 Minioadmin123
spark.hadoop.fs.s3a.path.style.access          true
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider   org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# -- Timezone ----------------------------------------------------------------
spark.sql.session.timeZone                      Asia/Ho_Chi_Minh

# =============================================================================
# PERFORMANCE OPTIMIZED SETTINGS
# =============================================================================

# -- Resource Allocation (Batch ETL) -----------------------------------------
# Worker has 8 cores, 8GB RAM. Allocate for batch jobs:
spark.cores.max                                 6
spark.executor.cores                            2
spark.executor.instances                        3
spark.executor.memory                           2g
spark.driver.memory                             1g
spark.driver.memoryOverhead                     256m
spark.executor.memoryOverhead                   512m

# -- Adaptive Query Execution (AQE) -----------------------------------------
# Automatically optimize shuffle partitions and handle skew
spark.sql.adaptive.enabled                      true
spark.sql.adaptive.coalescePartitions.enabled   true
spark.sql.adaptive.coalescePartitions.minPartitionNum  4
spark.sql.adaptive.skewJoin.enabled             true
spark.sql.adaptive.skewJoin.skewedPartitionFactor  5
spark.sql.adaptive.skewJoin.skewedPartitionThresholdInBytes  256m

# -- Shuffle Optimization ----------------------------------------------------
spark.sql.shuffle.partitions                    32
spark.sql.files.maxPartitionBytes               134217728  # 128MB per partition
spark.sql.files.openCostInBytes                 8388608    # 8MB

# -- Serialization (Kryo is faster than Java) --------------------------------
spark.serializer                                org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max                 256m
spark.kryo.registrationRequired                 false

# -- Memory Management -------------------------------------------------------
spark.memory.fraction                           0.8
spark.memory.storageFraction                    0.2
spark.shuffle.compress                          true
spark.shuffle.spill.compress                    true

# -- Broadcast Join Threshold (auto-broadcast small tables < 10MB) -----------
spark.sql.autoBroadcastJoinThreshold            10485760   # 10MB

# -- Iceberg Write Optimization ----------------------------------------------
spark.sql.catalog.lakehouse.write.target-file-size-bytes  134217728  # 128MB
spark.sql.catalog.lakehouse.write.distribution-mode       hash
spark.sql.catalog.lakehouse.write.parquet.compression-codec  zstd
spark.sql.catalog.lakehouse.write.parquet.page-size-bytes   1048576   # 1MB
spark.sql.catalog.lakehouse.write.parquet.page-row-count-limit  20000

# -- Iceberg Read Optimization -----------------------------------------------
spark.sql.catalog.lakehouse.read.split.target-size        134217728  # 128MB
spark.sql.catalog.lakehouse.read.split.planning-lookback  3

# -- JDBC drivers (bundled in image) -----------------------------------------
spark.driver.extraClassPath             /opt/spark/jars/postgresql-42.7.1.jar
spark.executor.extraClassPath           /opt/spark/jars/postgresql-42.7.1.jar

# =============================================================================
# NOTES:
# - AQE (Adaptive Query Execution) automatically optimizes at runtime
# - Shuffle partitions set to 32, but AQE will coalesce if needed
# - Kryo serialization is 2-10x faster than Java serialization
# - Zstd compression provides better ratio than Snappy with similar speed
# - For streaming jobs, override via BashOperator: --conf spark.cores.max=1
# =============================================================================
