# =============================================================================
# Spark Defaults — Banking Data Platform
# =============================================================================
# Container memory budget:
#   Worker total: 9000m (set in docker-compose.yml)
#   Streaming apps: 512m driver + 512m executor per app
#   Batch ETL: 512m driver + 512m executor per job
#   With 8 cores, up to 8 streaming apps can run concurrently
# =============================================================================

# -- Event Logging -----------------------------------------------------------
spark.eventLog.enabled                          false

# -- Iceberg Extensions ------------------------------------------------------
spark.sql.extensions                            org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lakehouse                     org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type                rest
spark.sql.catalog.lakehouse.uri                 http://iceberg-rest:8181
spark.sql.catalog.lakehouse.warehouse           s3a://lakehouse/lakehouse
spark.sql.catalog.lakehouse.io-impl             org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.endpoint         http://minio:9000
spark.sql.catalog.lakehouse.s3.path-style-access true
spark.sql.catalog.lakehouse.s3.access-key-id    minioadmin
spark.sql.catalog.lakehouse.s3.secret-access-key Minioadmin123
spark.sql.defaultCatalog                        lakehouse

# -- S3A / MinIO -------------------------------------------------------------
spark.hadoop.fs.s3a.endpoint                    http://minio:9000
spark.hadoop.fs.s3a.access.key                 minioadmin
spark.hadoop.fs.s3a.secret.key                 Minioadmin123
spark.hadoop.fs.s3a.path.style.access          true
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider   org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# -- Timezone ----------------------------------------------------------------
spark.sql.session.timeZone                      Asia/Ho_Chi_Minh

# -- Resource per application (multiple streaming apps) ----------------------
# Each streaming app gets 1 core + 1 executor. With 8 cores, up to 8 apps.
spark.cores.max                                 1
spark.executor.cores                            1
spark.executor.instances                        1
spark.executor.memory                           512m
spark.driver.memory                             512m
spark.driver.memoryOverhead                     128m
spark.executor.memoryOverhead                   128m

# -- Serializer & shuffle ----------------------------------------------------
spark.serializer                                org.apache.spark.serializer.JavaSerializer
spark.sql.shuffle.partitions                    4

# -- JDBC drivers (bundled in image) -----------------------------------------
spark.driver.extraClassPath             /opt/spark/jars/postgresql-42.7.1.jar
spark.executor.extraClassPath           /opt/spark/jars/postgresql-42.7.1.jar
