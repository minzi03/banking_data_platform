groups:
  - name: pipeline_alerts
    rules:
      - alert: DAGFailure
        expr: airflow_dag_run_state{state="failed"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: DAG {{ $labels.dag_id }} has failed
          description: Pipeline {{ $labels.dag_id }} failed at {{ $value }}
      - alert: DataFreshnessBreach
        expr: cdc_freshness_seconds > 3600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: CDC data freshness SLA breach
          description: CDC freshness {{ $value }}s exceeds 1h SLA
      - alert: DQFailure
        expr: dq_check_status{status="FAIL"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Data quality check failed on {{ $labels.table_name }}
          description: 'Check {{ $labels.check_name }} failed: {{ $value }}'
      - alert: RowCountAnomaly
        expr: abs(delta(table_row_count[1h])) / table_row_count > 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Row count anomaly detected
          description: Table {{ $labels.table_name }} row count changed by {{ $value | humanizePercentage }}
      - alert: SparkStreamingQueryInactive
        expr: spark_streaming_query_active == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Spark streaming query is inactive
          description: Query {{ $labels.query }} has reported inactive for 5 minutes.
      - alert: SparkStreamingHeartbeatStale
        expr: time() - spark_streaming_last_heartbeat_timestamp_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Spark streaming heartbeat is stale
          description: Query {{ $labels.query }} has not reported a heartbeat for 5 minutes.
      - alert: SparkStreamingKafkaLagHigh
        expr: spark_streaming_kafka_offsets_behind_latest > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Spark streaming Kafka lag is high
          description: Query {{ $labels.query }} is {{ $value }} offsets behind latest.
      - alert: CDCDeadLetterGrowth
        expr: increase(cdc_dead_letter_rows_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: CDC dead-letter rows are increasing
          description: CDC DLQ received new invalid events in the last 15 minutes.
      - alert: MerchantEODReconciliationFailed
        expr: increase(merchant_eod_reconciliation_failures_total[15m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Merchant EOD reconciliation failed
          description: Merchant streaming/batch reconciliation reported a failure.
