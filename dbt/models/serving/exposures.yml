# =============================================================================
# Exposures — CỐ Ý ĐỂ TRỐNG
# =============================================================================
# Không có exposure nào ở đây vì hiện chưa có consumer nào được kiểm chứng là
# đọc tầng serving. Một exposure là lời khẳng định rằng downstream có thật; nó
# không phải chỗ để bày tỏ mong muốn.
#
# Đây là lần thứ hai file này mô tả sai consumer path:
#
#   Lần 1 — exposures trỏ vào `ref('sm_*_current')`, trong khi cả 12 model
#           `sm_*` đều `materialized: ephemeral`, tức KHÔNG tạo object nào
#           trong Iceberg. Không consumer nào query được thứ không tồn tại.
#           Đã gỡ ở v1.1 cùng với các model đó.
#
#   Lần 2 — exposures thay thế trỏ vào `ref('*_current')` và khai ba consumer:
#             superset_customer_360   Superset KHÔNG có trong stack. 24 service
#                                     trong docker-compose gồm `streamlit`,
#                                     không có `superset`. Tài liệu gọi nhầm
#                                     tên ứng dụng dashboard suốt một thời gian
#                                     dài (demo.md còn ghi "Superset at
#                                     http://localhost:8501" — cổng của
#                                     Streamlit).
#             streamlit_analytics     Ứng dụng có thật, nhưng nó đọc
#                                     `FROM gold.mart_customer_360` — historical
#                                     Gold, KHÔNG phải serving. Và nó nối Trino
#                                     bằng catalog `lakehouse` (tên của Spark)
#                                     trong khi Trino chỉ có `iceberg`, nên mọi
#                                     query đều fail.
#             readme_sql_examples     Ví dụ SQL trong tài liệu không phải một
#                                     downstream consumer theo nghĩa dbt; và
#                                     chúng cũng query historical Gold.
#
# Bài học đã trả giá hai lần: đừng thay một claim không có cơ sở bằng một claim
# nghe hợp lý hơn nhưng cũng không có cơ sở. Publication đúng đắn và adoption là
# hai điều khác nhau — serving được build và test, nhưng chưa ai dùng nó.
#
# Khôi phục exposure khi, và chỉ khi, một consumer được kiểm chứng là query
# serving qua Trino. Xem TD-7 trong docs/technical-debt.md.
# =============================================================================

