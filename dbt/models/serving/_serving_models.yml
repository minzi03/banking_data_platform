version: 2

# =============================================================================
# Serving models — grain contract + data quality tests
# =============================================================================
# Cả 9 object đều grain customer_id. Ba ràng buộc bắt buộc cho mọi model:
#   unique(customer_id)   → grain không vỡ (chống fan-out tái phát ở serving)
#   not_null(customer_id) → khoá nghiệp vụ đầy đủ
#   not_null(cob_dt)      → luôn biết đang phục vụ snapshot nào
#
# Điều kiện "row_count > 0" và "cob_dt = var" nằm ở singular test
# tests/assert_serving_snapshot_alignment.sql vì nó so với tham số runtime.
# =============================================================================

models:
  - name: rfm_segment_current
    description: "RFM segmentation — current serving, wave 1, do dbt/Trino sở hữu."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: cob_dt
        data_tests: [not_null]
      - name: rfm_segment
        data_tests:
          - not_null
          - accepted_values:
              values: ['Champions', 'Loyal Customers', 'Potential Loyalists', 'Recent Customers', 'Promising', 'Need Attention', 'About to Sleep', 'At Risk', 'Cannot Lose Them', 'Hibernating', 'Lost']
      - name: rfm_score
        data_tests:
          - not_null

  - name: churn_prediction_current
    description: "Churn risk (rule-based) — current serving, wave 1, do dbt/Trino sở hữu."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: cob_dt
        data_tests: [not_null]
      - name: churn_risk
        data_tests:
          - not_null
          - accepted_values:
              values: ['HIGH', 'MEDIUM', 'LOW']
      - name: is_churn_candidate
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]

  - name: customer_transaction_summary_current
    description: "Transaction behaviour 30d — current serving, wave 1, do dbt/Trino sở hữu."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: cob_dt
        data_tests: [not_null]
      - name: total_txn_count_30d
        data_tests:
          - not_null
      - name: total_txn_amount_30d
        data_tests:
          - not_null
      - name: last_txn_date
        data_tests:
          - not_null

  - name: customer_balance_summary_current
    description: "Balance / AUM — current serving, wave 2, do dbt/Trino sở hữu."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: cob_dt
        data_tests: [not_null]
      - name: aum_total
        data_tests:
          - not_null
      - name: aum_bucket
        data_tests:
          - not_null
          - accepted_values:
              values: ['0-50M', '50M-200M', '200M-500M', '500M-1B', '1B+']

  - name: customer_card_summary_current
    description: "Card holding + card txn 30d — current serving, wave 2, do dbt/Trino sở hữu."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: cob_dt
        data_tests: [not_null]
      - name: total_cards
        data_tests:
          - not_null
      - name: cnt_credit_active
        data_tests:
          - not_null

  - name: customer_product_summary_current
    description: "Product holding — current serving, wave 2, do dbt/Trino sở hữu."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: cob_dt
        data_tests: [not_null]
      - name: has_credit_card
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: has_savings
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: has_loan
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]

  - name: cross_sell_segment_current
    description: "Cross-sell opportunity — current serving, wave 2, do dbt/Trino sở hữu."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: cob_dt
        data_tests: [not_null]
      - name: customer_segment
        data_tests:
          - not_null
          - accepted_values:
              values: ['RETAIL', 'PRIORITY', 'VIP']
      - name: primary_opportunity
        data_tests:
          - not_null

  - name: campaign_target_current
    description: "Campaign targeting — current serving, wave 2, do dbt/Trino sở hữu."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: cob_dt
        data_tests: [not_null]
      - name: campaign_type
        data_tests:
          - not_null
          - accepted_values:
              values: ['RETENTION', 'CROSS_SELL', 'UPSELL', 'WIN_BACK', 'VIP_ENGAGEMENT']
      - name: rfm_segment
        data_tests:
          - not_null
      - name: churn_risk
        data_tests:
          - not_null
          - accepted_values:
              values: ['HIGH', 'MEDIUM', 'LOW']

  - name: mart_customer_360_current
    description: "Customer 360 — current serving, wave 3, do dbt/Trino sở hữu."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: cob_dt
        data_tests: [not_null]
      - name: customer_segment
        data_tests:
          - not_null
          - accepted_values:
              values: ['RETAIL', 'PRIORITY', 'VIP']
      - name: kyc_status
        data_tests:
          - not_null
          - accepted_values:
              values: ['VERIFIED', 'PENDING', 'REJECTED']
      - name: rfm_segment
        data_tests:
          - not_null
      - name: churn_flag
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: cross_sell_credit_card_flag
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: total_accounts
        data_tests:
          - not_null
      - name: total_cards
        data_tests:
          - not_null
      - name: total_loans
        data_tests:
          - not_null
      - name: aum_total
        data_tests:
          - not_null
