        data_tests: [not_null]

  - name: customer_card_summary_current
    description: "Card holding + card txn 30d — current serving, wave 2, do dbt/Trino sở hữu."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: cob_dt
        data_tests: [not_null]

  - name: customer_product_summary_current
    description: "Product holding — current serving, wave 2, do dbt/Trino sở hữu."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: cob_dt
