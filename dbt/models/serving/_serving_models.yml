  - name: cross_sell_segment_current
    description: "Cross-sell opportunity — current serving, wave 2, do dbt/Trino sở hữu."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: cob_dt
        data_tests: [not_null]

  - name: campaign_target_current
    description: "Campaign targeting — current serving, wave 2, do dbt/Trino sở hữu."
