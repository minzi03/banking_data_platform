# =============================================================================
# dbt Project Configuration — Banking Data Platform
# =============================================================================
# Architecture: Lakehouse 2.0
# Spark handles Bronze → Silver → Gold transforms
# dbt handles Semantic Layer on Gold (metrics, docs, lineage)
# =============================================================================

name: 'banking'
version: '1.0.0'
config-version: 2

profile: 'banking'

model-paths: ["models"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ==========================================================================
# MODEL CONFIGURATIONS
# ==========================================================================
models:
  banking:
    # ─── SERVING LAYER ───────────────────────────────────────────────────
    # Object phục vụ do TRINO sở hữu, không phải Spark. Consumer thật
    # (dbt / Superset / SQL trong README) đều đi qua Trino.
    serving:
      # view không khả dụng: Iceberg REST catalog của Trino không hỗ trợ createView
      +materialized: table
      +schema: serving
      +tags: ["serving"]

# ==========================================================================
# VARIABLES (Global)
# ==========================================================================
vars:
  churn_inactive_days: 90
  rfm_lookback_days: 365
