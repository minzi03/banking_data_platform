# =============================================================================
# dbt Profile Configuration — Banking Data Platform
# =============================================================================
# Architecture: Lakehouse 2.0
# Connection: Trino → Iceberg
# =============================================================================

# ⚠ catalog PHẢI là `iceberg` — đó là tên catalog của Trino, quyết định bởi
# tên file docker/init_trino/catalog/iceberg.properties.
# `lakehouse` là tên phía SPARK (spark-defaults.conf). Dùng nhầm tên đó khiến
# MỌI model fail CATALOG_NOT_FOUND, trong khi `dbt debug` vẫn báo
# "All checks passed!" vì nó chỉ test kết nối chứ không validate catalog.
# Vì thế có thêm tests/assert_gold_source_reachable.sql làm smoke test thật.
banking:
  target: docker

  outputs:
    dev:
      type: trino
      method: none
      host: localhost
      port: 8085
      catalog: iceberg
      schema: semantic
      user: admin
      password: ""
      threads: 1
      timeout_seconds: 300

    # Docker target (when running inside Docker network)
    docker:
      type: trino
      method: none
      host: trino
      port: 8080
      catalog: iceberg
      schema: semantic
      user: admin
      password: ""
      threads: 4
      timeout_seconds: 300

    prod:
      type: trino
      method: none
      host: trino
      port: 8080
      catalog: iceberg
      schema: semantic
      user: admin
      password: ""
      threads: 8
      timeout_seconds: 600
