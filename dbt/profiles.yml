# =============================================================================
# dbt Profile Configuration — Banking Data Platform
# =============================================================================
# Architecture: Lakehouse 2.0
# Connection: Trino → Iceberg
# =============================================================================

# ⚠ catalog PHẢI là `iceberg` — đó là tên catalog của Trino, quyết định bởi
# tên file docker/init_trino/catalog/iceberg.properties.
# `lakehouse` là tên phía SPARK (spark-defaults.conf). Dùng nhầm tên đó khiến
# MỌI model fail CATALOG_NOT_FOUND, trong khi `dbt debug` vẫn báo
# "All checks passed!" vì nó chỉ test kết nối chứ không validate catalog.
# Vì thế có thêm tests/assert_gold_source_reachable.sql làm smoke test thật.
banking:
  target: docker

  outputs:
    dev:
      type: trino
      method: none
      host: localhost
      port: 8085
      catalog: iceberg
      schema: semantic
      user: dbt
      password: ""
      threads: 1
      timeout_seconds: 300

    # Docker target (when running inside Docker network)
    # ADR-0016: có TRINO_PASSWORD → xác thực mật khẩu (dbt-trino gọi là `ldap`)
    # qua HTTPS 8443, verify bằng cert của stack. Không có → như trước.
    docker:
      type: trino
      method: "{{ 'ldap' if env_var('TRINO_PASSWORD', '') else 'none' }}"
      http_scheme: "{{ 'https' if env_var('TRINO_PASSWORD', '') else 'http' }}"
      host: trino
      port: "{{ 8443 if env_var('TRINO_PASSWORD', '') else 8080 }}"
      cert: "{{ env_var('TRINO_CA_CERT', '/usr/src/dbt/.trino/trino.pem') }}"
      catalog: iceberg
      schema: semantic
      user: dbt
      password: "{{ env_var('TRINO_PASSWORD', '') }}"
      threads: 4
      timeout_seconds: 300

    prod:
      type: trino
      method: none
      host: trino
      port: 8080
      catalog: iceberg
      schema: semantic
      user: dbt
      password: ""
      threads: 8
      timeout_seconds: 600
