# Dataset Contract: customer_product_summary (Gold History Snapshot)
# Customer product portfolio summary across snapshots

dataset_id: banking.customer_product_summary_gold
owner: Data Engineering Team
business_purpose: >
  Daily snapshot history of customer product portfolio summary. Grain is one row
  per customer per cob_dt. Used for historical product holding analysis.
refresh_sla: daily
quality_class: important
layer: gold

physical_location:
  catalog: lakehouse
  namespace: gold
  table: customer_product_summary

dag_id: gold_mart360_dag

upstream_dataset_ids:
  - banking.mart_customer_360_gold

quality_rules:
  required_columns:
    - customer_id
    - customer_sk
    - total_accounts
    - cnt_casa_active
    - cnt_td_active
    - total_cards
    - cnt_credit_cards
    - cnt_debit_cards
    - has_credit_card
    - has_savings
    - has_loan
    - cob_dt
  non_null_columns:
    - customer_id
    - customer_sk
    - cob_dt
  min_row_count: 5000
  unique_column_sets:
    - [customer_id, cob_dt]
  date_column: cob_dt
  forbid_future_dates: true
  freshness_sla_hours: 24

ai_governance:
  ai_use_allowed: true
  risk_tier: limited_risk
  intended_uses:
    - customer_analytics
    - product_portfolio_analysis
    - historical_product_tracking
  prohibited_uses:
    - external_sharing
