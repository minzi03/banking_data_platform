# Dataset Contract: fact_crm_interaction (Silver)
# CRM interaction fact table

dataset_id: banking.fact_crm_interaction_silver
owner: Data Engineering Team
business_purpose: >
  Cleansed fact table capturing all customer relationship management
  interactions including calls, emails, and in-branch visits. Tracks
  interaction type, channel, responsible agent, and resolution status.
  Used for customer service analytics and agent performance reporting.
refresh_sla: daily
quality_class: critical
layer: silver

physical_location:
  catalog: lakehouse
  namespace: silver
  table: fact_crm_interaction

dag_id: silver_all_dag

upstream_dataset_ids:
  - banking.core_customer_bronze

quality_rules:
  required_columns:
    - interaction_id
    - customer_id
    - interaction_date
    - interaction_type
    - channel
    - agent_id
    - resolution
  non_null_columns:
    - interaction_id
    - customer_id
    - interaction_date
    - interaction_type
    - channel
  min_row_count: 5000
  unique_check:
    - interaction_id
  freshness_sla_hours: 24

ai_governance:
  ai_use_allowed: true
  risk_tier: limited_risk
  intended_uses:
    - customer_analytics
    - fraud_detection
  prohibited_uses:
    - automated_decision_making
