# Dataset Contract: dim_device (Silver)
# Customer device dimension

dataset_id: banking.dim_device_silver
owner: Data Engineering Team
business_purpose: >
  Cleansed device dimension tracking customer devices used for online and
  mobile banking. Captures device type, operating system, and browser
  information. Supports fraud detection and digital channel analytics.
refresh_sla: daily
quality_class: critical
layer: silver

physical_location:
  catalog: lakehouse
  namespace: silver
  table: dim_device

dag_id: silver_all_dag

upstream_dataset_ids:
  - banking.core_customer_bronze

quality_rules:
  required_columns:
    - device_id
    - customer_id
    - device_type
    - os
    - browser
    - is_active
  non_null_columns:
    - device_id
    - customer_id
    - device_type
  min_row_count: 500
  unique_check:
    - device_id
  freshness_sla_hours: 24

ai_governance:
  ai_use_allowed: true
  risk_tier: limited_risk
  intended_uses:
    - customer_analytics
    - fraud_detection
  prohibited_uses:
    - automated_decision_making
