# Dataset Contract: customer_product_summary_current (Gold Current Serving)
# Current customer product summary, exactly 1 row/customer

dataset_id: banking.customer_product_summary_current_gold
owner: Data Engineering Team
business_purpose: >
  Latest current-serving customer product portfolio summary. Grain is exactly
  one row per customer, published by dbt from gold.customer_product_summary for the run's cob_dt — not MAX(cob_dt), so a failed day is never served as the previous one.
refresh_sla: daily
quality_class: important
layer: serving

physical_location:
  catalog: lakehouse
  namespace: serving
  table: customer_product_summary_current

dag_id: dbt_serving_publish

upstream_dataset_ids:
  - banking.customer_product_summary_gold

quality_rules:
  required_columns:
    - customer_id
    - customer_sk
    - total_accounts
    - total_cards
    - has_credit_card
    - has_savings
    - has_loan
    - cob_dt
  non_null_columns:
    - customer_id
    - customer_sk
    - cob_dt
  min_row_count: 5000
  unique_check:
    - customer_id
  date_column: cob_dt
  forbid_future_dates: true
  freshness_sla_hours: 24

ai_governance:
  ai_use_allowed: true
  risk_tier: limited_risk
  intended_uses:
    - product_portfolio_serving
    - current_holding_analysis
  prohibited_uses:
    - external_sharing
