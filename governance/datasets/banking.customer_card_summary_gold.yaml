# Dataset Contract: customer_card_summary (Gold History Snapshot)
# Customer card portfolio summary across snapshots

dataset_id: banking.customer_card_summary_gold
owner: Data Engineering Team
business_purpose: >
  Daily snapshot history of customer card portfolio summary. Grain is one row
  per customer per cob_dt. Used for historical card usage and portfolio analysis.
refresh_sla: daily
quality_class: important
layer: gold

physical_location:
  catalog: lakehouse
  namespace: gold
  table: customer_card_summary

dag_id: gold_mart360_dag

upstream_dataset_ids:
  - banking.mart_customer_360_gold

quality_rules:
  required_columns:
    - customer_id
    - customer_sk
    - total_cards
    - cnt_credit_active
    - cnt_debit_active
    - max_credit_limit
    - total_card_txn_count_30d
    - total_card_txn_amount_30d
    - avg_card_txn_amount_30d
    - distinct_merchant_categories
    - last_card_txn_date
    - cob_dt
  non_null_columns:
    - customer_id
    - customer_sk
    - cob_dt
  min_row_count: 5000
  unique_column_sets:
    - [customer_id, cob_dt]
  date_column: cob_dt
  forbid_future_dates: true
  freshness_sla_hours: 24

ai_governance:
  ai_use_allowed: true
  risk_tier: limited_risk
  intended_uses:
    - customer_analytics
    - card_portfolio_analysis
    - historical_card_tracking
  prohibited_uses:
    - external_sharing
