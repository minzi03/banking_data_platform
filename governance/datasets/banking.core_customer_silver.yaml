# Dataset Contract: dim_customer (Silver)
# Conformed customer dimension with SCD2 history tracking

dataset_id: banking.core_customer_silver
owner: Data Engineering Team
business_purpose: >
  Cleansed and deduplicated customer dimension with slowly changing dimension
  type 2 (SCD2) history tracking. Provides the single source of truth for
  customer attributes across the data platform.
refresh_sla: daily
quality_class: critical
layer: silver

physical_location:
  catalog: lakehouse
  namespace: silver
  table: dim_customer

dag_id: silver_all_dag

upstream_dataset_ids:
  - banking.core_customer_bronze

quality_rules:
  required_columns:
    - customer_id
    - cccd
    - full_name
    - gender
    - date_of_birth
    - phone
    - email
    - address
    - city
    - district
    - branch_code
    - customer_segment
    - kyc_status
    - register_date
    - is_active
    - effective_from
    - effective_to
    - is_current
  non_null_columns:
    - customer_id
    - cccd
    - full_name
    - effective_from
    - effective_to
    - is_current
  min_row_count: 5000
  unique_check:
    - customer_id
  freshness_sla_hours: 24

ai_governance:
  ai_use_allowed: true
  risk_tier: limited_risk
  intended_uses:
    - customer_analytics
    - fraud_detection
  prohibited_uses:
    - automated_decision_making
