# Dataset Contract: customer_transaction_summary (Gold History Snapshot)
# Customer transaction summary across snapshots

dataset_id: banking.customer_transaction_summary_gold
owner: Data Engineering Team
business_purpose: >
  Daily snapshot history of customer transaction activity. Grain is one row per
  customer per cob_dt. Used for transaction behavior trends and activity tracking.
refresh_sla: daily
quality_class: important
layer: gold

physical_location:
  catalog: lakehouse
  namespace: gold
  table: customer_transaction_summary

dag_id: gold_mart360_dag

upstream_dataset_ids:
  - banking.mart_customer_360_gold

quality_rules:
  required_columns:
    - customer_id
    - customer_sk
    - acct_txn_count_30d
    - acct_txn_amount_30d
    - acct_credit_count_30d
    - acct_debit_count_30d
    - card_txn_count_30d
    - card_txn_amount_30d
    - total_txn_count_30d
    - total_txn_amount_30d
    - last_txn_date
    - cob_dt
  non_null_columns:
    - customer_id
    - customer_sk
    - cob_dt
  min_row_count: 5000
  unique_column_sets:
    - [customer_id, cob_dt]
  date_column: cob_dt
  forbid_future_dates: true
  freshness_sla_hours: 24

ai_governance:
  ai_use_allowed: true
  risk_tier: limited_risk
  intended_uses:
    - customer_analytics
    - transaction_analysis
    - historical_behavior_tracking
  prohibited_uses:
    - external_sharing
