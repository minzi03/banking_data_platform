  snapshot_bronze_exists:
    metric: manifest.snapshot.bronze_partition_exists
    operator: eq
    expected: true
    severity: error
  snapshot_silver_exists:
    metric: manifest.snapshot.silver_partition_exists
    operator: eq
    expected: true
    severity: error
  snapshot_gold_exists:
    metric: manifest.snapshot.gold_partition_exists
    operator: eq
    expected: true
    severity: error
  scd2_no_duplicate_current_keys:
    metric: metrics.silver.scd2.*.duplicate_current_keys
    operator: eq
    expected: 0
    severity: error
  scd2_current_rows_match_distinct:
    metric: metrics.silver.scd2.*.current_rows
    compare_to: metrics.silver.scd2.*.current_distinct_business_keys
    operator: eq
    severity: error
  scd2_no_overlapping_intervals:
    metric: metrics.silver.scd2.*.overlapping_intervals
    operator: eq
    expected: 0
    severity: error
    rationale: Invariant mà chỉ nhìn is_current không phát hiện được.
  silver_fact_snapshot_not_duplicated:
    metric: metrics.silver.snapshot_rows.fact_txn_account.rows
    compare_to: metrics.silver.snapshot_rows.fact_txn_account.distinct_txn_id
    operator: eq
    severity: error
    rationale: 'Trong PHẠM VI một cob_dt partition, rows phải bằng distinct business
      key. rows > distinct nghĩa là partition tự trùng — gốc của con số 4.6M.

      '
  silver_card_snapshot_not_duplicated:
    metric: metrics.silver.snapshot_rows.fact_card_txn.rows
    compare_to: metrics.silver.snapshot_rows.fact_card_txn.distinct_txn_id
    operator: eq
    severity: error
  silver_online_snapshot_not_duplicated:
    metric: metrics.silver.snapshot_rows.fact_online_transaction.rows
    compare_to: metrics.silver.snapshot_rows.fact_online_transaction.distinct_transaction_id
    operator: eq
    severity: error
  gold_grain_no_duplicates:
    metric: metrics.gold.grain_checks.*.duplicate_customer_ids
    operator: eq
    expected: 0
    severity: error
    rationale: Grain 1 dòng/customer/cob_dt — vi phạm nghĩa là fan-out quay lại.
  churn_reconciles_amount:
    metric: metrics.gold.reconciliation.churn_vs_transaction_summary_30d.mismatched_customers
    operator: eq
    expected: 0
    severity: error
    rationale: Invariant chính chống fan-out tái phát ở một trong hai model.
  churn_reconciles_count:
    metric: metrics.gold.reconciliation.churn_count_vs_transaction_summary_30d.mismatched_customers
    operator: eq
    expected: 0
    severity: error
  rfm_monetary_recompute_matches:
    metric: metrics.gold.reconciliation.rfm_monetary_recompute_90d.mismatched_customers
    operator: eq
    expected: 0
    severity: error
  cdc_current_state_unique:
    metric: metrics.cdc.current_state.*.duplicate_keys
    operator: eq
    expected: 0
    severity: error
    rationale: Silver Current = 1 business key → 1 dòng.
  serving_snapshot_alignment:
    metric: metrics.serving.current_snapshot_alignment.value
    operator: eq
    expected: 0
    severity: error
    rationale: 'Hợp đồng phục vụ: mọi serving object phải tồn tại, không rỗng, grain
      đúng, và phục vụ ĐÚNG cob_dt đang verify. Thay cho gold_current_tables_not_stale
      — giải quyết đúng bản chất thay vì chỉ làm manifest xanh.

      '
  serving_objects_complete:
    metric: metrics.serving.objects_present.value
    compare_to: metrics.serving.objects_present.declared
    operator: eq
    severity: error
    rationale: Thiếu serving object nghĩa là consumer path bị hở.
  legacy_gold_current_retired:
    metric: metrics.gold.legacy_gold_current_objects.value
    operator: eq
    expected: 0
    severity: error
    rationale: 'NÂNG TỪ WARN LÊN ERROR sau khi migration hoàn tất.

      Trong giai đoạn chuyển tiếp đây là WARN vì legacy còn đóng vai trò fallback
      trong lúc serving chưa có production refresh path. Giờ dbt_serving_publish DAG
      đã được chứng minh cả positive lẫn negative path (GOLD_COMPLETE → dbt build
      → SERVING_COMPLETE, và thiếu flag thì không chạy), nên legacy không còn vai
      trò nào.

      8 CTAS đã bị gỡ khỏi 03_ddl_gold.sql. Nếu chúng xuất hiện lại thì hoặc DDL bị
      thêm lại, hoặc có đường bootstrap khác đang tạo chúng — cả hai đều là dual-ownership
      và phải chặn.

      '
  worktree_clean:
    metric: manifest.build.git_dirty
    operator: eq
    expected: false
    severity: error
    rationale: 'Canonical verified manifest chỉ promote khi worktree sạch, nếu không
      git_commit không mô tả đúng code đã sinh ra số liệu. Chạy local có thể bỏ qua
      bằng --allow-dirty (chỉ ghi run artifact).

      '
  legacy_spark_view_retired:
    metric: metrics.serving.trino.mart_customer_360_current_visible.value
    operator: eq
    expected: 0
    severity: error
    rationale: 'ĐẢO CHIỀU CÓ CHỦ Ý so với invariant trước đó.

      Trước migration, câu hỏi đúng là "Spark view mart_customer_360_current có hiển
      thị trên Trino không?" — trả lời KHÔNG, và đó là ERROR vì Trino là serving engine.

      Sau migration hướng C, nhu cầu phục vụ đã do serving.mart_customer_360_current
      (dbt/Trino sở hữu, reconcile 1:1) đáp ứng. Nên câu hỏi đúng bây giờ là "Spark
      view đã được retire chưa?" — kỳ vọng value = 0, tức Trino KHÔNG còn thấy nó
      vì nó đã bị xoá.

      Sau retirement, CREATE OR REPLACE VIEW đã bị gỡ khỏi 03_ddl_gold.sql nên value
      = 0 có nghĩa ĐÚNG: object không còn tồn tại, không phải "tồn tại nhưng Trino
      không thấy". Vì thế nâng lên ERROR — nếu Trino lại thấy nó, nghĩa là có ai đó
      tạo lại object legacy.

      '
  branch_monthly_cross_engine_reconciles:
    metric: metrics.gold.reconciliation.branch_monthly_recompute.mismatched_buckets
    operator: eq
    expected: 0
    severity: error
    rationale: 'NÂNG LÊN ERROR sau timezone migration.

      Trước migration, lệch date-bucket giữa hai engine là accepted debt (WARN) vì
      kiến trúc chưa tuyên bố business timezone. Giờ contract đã tuyên bố tường minh:
      instant = UTC, business date = derive explicit. Nên Spark và Trino ĐỘC LẬP implement
      cùng một contract phải ra cùng kết quả — lệch là lỗi, không còn là debt.

      Chọn branch_monthly vì nó phủ CALENDAR bucket; rolling window đã được phủ bởi
      churn/rfm reconciliation.

      '
  static_metrics_match_declared:
    metric: __all_static__
    compare_to: __declared__
    operator: eq
    severity: warn
    rationale: 'Khi lệch, việc cần làm là sửa README + declared, không phải chặn sinh
      manifest. Đã biết lệch sẵn: docker_services, source_datasets, automated_tests.

      '
