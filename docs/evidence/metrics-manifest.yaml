    session_timezone_dependency_allowed: false
    canonical_spark_expression: CAST(from_utc_timestamp(<ts>, 'Asia/Ho_Chi_Minh')
      AS DATE)
    canonical_trino_expression: CAST(<ts> AT TIME ZONE 'Asia/Ho_Chi_Minh' AS DATE)
    note: '⚠ Biểu thức Spark chỉ ĐÚNG dưới session=UTC. Spark TIMESTAMP là LTZ: from_utc_timestamp
      dịch instant, rồi CAST render theo SESSION timezone. Đo được: session=UTC cho
      đúng ICT date; session=Asia/Ho_Chi_Minh dịch hai lần; session=America/New_York
      sai hẳn. Vì thế session=UTC là precondition được ENFORCE bởi assert_utc_session()
      trong code_etl/shared/spark/ spark_session.py, không phải giả định. cob_dt là
      orchestration date, độc lập hoàn toàn với session timezone.

      '
